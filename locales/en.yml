          Automate your localization process by setting up rules that trigger actions
          job creation. This feature will save you valuable time by automating repetitive
          tasks.
        title: Automations
      autopilot:
        description: Let pre-translation automatically translate new keys, languages,
          or files into multiple languages directly after uploading them to Phrase,
          using machine translation and translation memory.
        subtitle: Switch to our %{plan_name} plan and receive our pre-translation
          feature. Let Phrase translate new content automatically using translation
          memory and machine translation and speed up your localization process.
        title: Pre-translation
      batch_actions:
        description: Select multiple translation keys and apply changes to all of
          them in one click.
        subtitle: Switch to our %{plan_name} plan and get access to batch actions.
          Select multiple keys to perform batch actions, e.g. verifying or tagging
          multiple keys at once. This feature will save you valuable time by cutting
          off manual work.
        title: Batch actions
      bitbucket_sync:
        description: Import and export language files faster than ever with a native
          integration to Bitbucket.
        subtitle: Switch to our %{plan_name} plan and get access to our Bitbucket
          Sync. This feature lets you easily sync your Phrase projects with your Bitbucket
          repositories and speeds up developers' work by cutting off manual processes.
        title: Bitbucket Sync
      branching:
        description: Work on multiple releases and versions at the same time - just
          like in Git.
        subtitle: Switch to our %{plan_name} plan to get access to our Branching feature.
          Work on multiple releases and versions at the same time. Just like in Git.
          This feature increases security when working on multiple projects at the
          same time.
        title: Branching
      checks:
        description: Generate an overview of keys that don't comply with character
          limits, defined placeholders, or term base rules. You can also decide to
          enforce these rules so that translations can only be saved when all rules
          are respected.
        subtitle: Speed up your translation process with our quality assurance feature!
          Switch to our %{plan_name} plan and let Phrase Strings check all your translations
          for common issues like overly long wording, broken placeholders, or mistranslated
          terms (based on your term base).
        title: Quality assurance (QA)
      contentful:
        description: Sync your Contentful content with Phrase
        subtitle: Switch to our %{plan_name} plan to make use of our Contentful integration.
          Combine the strengths of Phrase and Contentful! Use Phrase Strings to organize
          your translation process and deliver high-quality translations. Access your
          translations from within Contentful for fast publication on multiple channels.
        title: Contentful integration
      figma:
        description: Sync your design content from Figma with Phrase Strings.
        subtitle: Switch to our %{plan_name} plan and use our Figma integration to
          create translation keys and jobs directly from within Figma. Screenshots
          are automatically attached and ensure high-quality translations. No more
          design breaks or delayed releases!
        title: Figma integration
      github_sync:
        description: Sync language files from your repository with Phrase Strings.
          Export translations to GitHub as a pull request.
        subtitle: Switch to our %{plan_name} plan to access our GitHub integration.
          Sync your Phrase Strings projects with your GitHub repositories easily.
          Save valuable developers' time by cutting off manual processes.
        title: GitHub Sync
      gitlab_sync:
        description: Easily sync language files to Phrase Strings and export translations
          back to your repository.
        subtitle: Switch to our %{plan_name} plan and get access to our GitLab Sync.
          Easily sync your Phrase projects with your GitLab repositories and save
          valuable developers' time.
        title: GitLab Sync
      glossary:
        description: Stay consistent throughout all languages. A term base is a list
          of predefined terms and translations that are unique to your business.
        subtitle: Switch to our %{plan_name} plan to access the term base feature.
          Define terms that are unique to your business or brand so that they remain
          consistent throughout all languages. This feature will help you ensure the
          highest translation quality.
        title: Term base
      history:
        description: Review all previous versions of a translation in the Changes
          tab of our translation editor.
        subtitle: Switch to our %{plan_name} plan to use the changes feature. See
          all previous versions of a translation in the translation editor. Easily
          revert back to a previous version, if needed, to ensure highest-quality
          translations.
        title: Changes
      in_context_editor:
        description: Translate directly on your website and view all translations
          in their actual context.
        subtitle: Switch to our %{plan_name} plan and receive our in-context editor
          to translate with maximum context. See in real-time what translations would
          look like on your website to ensure high-quality translations of your content.
        title: In-context editor
      jira:
        description: Connect Jira with Phrase for up-to-date information on both platforms.
        subtitle: Switch to our %{plan_name} plan and get access to our Jira integration.
          Connect your translation jobs to Jira tickets! Get notified of started and
          finished translation jobs directly in Jira to increase transparency and
          speed up your localization process.
        title: Jira integration
      job_templates:
        description: Create perfect translation jobs faster than ever. Save templates
          for a specific set of languages with assigned translators. Easily implement
          a high standard for job descriptions with reusable custom templates.
        subtitle: Create perfect translation jobs faster than ever. Save templates
          for a specific set of languages with assigned translators. Easily implement
          a high standard for job descriptions with reusable custom templates.
        title: Job Templates
      jobs:
        description: Organise all your translation tasks by assigning team members,
          providing descriptions and setting due dates to the languages of your choice.
        subtitle: Switch to our %{plan_name} plan to get access to our jobs feature.
          Organize your translation tasks by assigning team members, providing descriptions,
          and setting due dates. Save time with this efficient way of organizing translation
          work.
        title: Jobs
      ota:
        description: Stop waiting for the next deployment and start publishing all
          your translations in real-time directly in Phrase Strings.
        subtitle: Switch to our %{plan_name} plan and receive our over the air (OTA)
          feature. With OTA you can publish your translations for mobile applications
          faster and simpler than ever before. Stop waiting for the next deployment
          and start publishing all your translations in real-time directly in Phrase
          Strings.
        title: Over the Air
      repo_sync:
        description: Sync language files from your repository with Phrase Strings.
          Export translations to your favorite Git hosting service as a pull request.
        subtitle: Switch to our %{plan_name} plan to access our Git Sync integration.
          Sync your Phrase Strings projects with your online Git repositories easily.
          Save valuable developers' time by cutting off manual processes.
        title: Git Sync
      reporting:
        description: Always stay informed about the individual activities of your
          team members, including the amount of translated and verified words, keys,
          and much more. Access graphical pre-translation stats to continuously track
          your automatic translation sources and optimize how pre-translation fits
          best in your individual translation process.
        subtitle: Switch to our %{plan_name} plan and get access to analytics. Stay
          informed about your team members' performance, including the amount of translated
          words, keys, and much more.
        title: Reporting
      screenshots:
        description: Increase the contextual information by attaching screenshots
          to your translation keys.
        subtitle: Switch to our %{plan_name} plan and receive our screenshots feature.
          Give translators proper context by attaching screenshots to your translation
          keys. Screenshots enable translators to deliver high-quality translations.
        title: Attachable screenshots
      sketch:
        description: Sync your design content from Sketch with Phrase Strings.
        subtitle: Switch to our %{plan_name} plan to use the Sketch integration. Sync
          your designs from Sketch with Phrase Strings and integrate localization
          into your design process. Translators can already start working while developers
          build your feature. By syncing translations back to Sketch, you can avoid
          any design breaks in the finished product.
        title: Sketch integration
      slack:
        description: Easily post Phrase events to Slack channels.
        subtitle: Switch to our %{plan_name} plan and receive our Slack integration
          to get your notifications in Slack. Keep all stakeholders informed about
          translation projects and speed up communication by connecting Phrase with
          Slack.
        title: Slack integration
      smart_suggest:
        description: Get real-time suggestions while translating in the Phrase Strings
          translation editor. Autocomplete speeds up your translation work.
        subtitle: Switch to our %{plan_name} plan to use our autocomplete feature.
          Speed up your translation work and improve overall consistency with real-time
          suggestions.
        title: Autocomplete
      spaces:
        description: Clustering your localization projects into spaces is a great
          time-saver.
        subtitle: Switch to our %{plan_name} plan and receive our spaces feature.
          Clustering your localization projects into spaces is a great time-saver.
          Assign access rights to an entire space instead of selecting projects manually
          and navigate through your projects faster.
        title: Spaces
      sso:
        description: Get access to Phrase Strings conveniently via SAML, with an identity
          provider of your choice.
        subtitle: Switch to our %{plan_name} plan to use SSO. Enable your team to
          access Phrase easily with single sign-on and make security a top priority.
        title: Single sign-on
      teams:
        description: Scale up the number of projects, languages, and users in Phrase
          without having to worry about user management..
        subtitle: Upgrade to the %{plan_name} plan and manage access rights efficiently
          with the teams feature! Assign access rights to entire teams instead of
          defining them for each individual user.
        title: Teams
      translation_memory:
        description: Speed up your localization process with our translation memory.
          The translation memory remembers translations used in your projects and
          suggests matching results.
        subtitle: Switch to our %{plan_name} plan and receive our translation memory
          feature. All your translations are stored and automatically made available
          to use in conjunction with pre-translation or autocomplete. This feature
          will allow you to achieve the highest level of translation quality for your
          content.
        title: Translation memory
      verification_system:
        description: Automatically notify your translators about changes in the source
          language and request a revision of the translated keys to ensure a consistent
          communication in all languages.
        subtitle: Switch to our %{plan_name} plan and get access to the basic review
          workflow. When the source content changes, translations are automatically
          marked as unverified. You can filter unverified translations and request
          verification by a translator.
        title: Basic review workflow
      webhook_integration:
        description: Build your custom webhook integration by sending notifications
          to external services, e.g. chat tools.
        subtitle: Switch to our %{plan_name} plan to get access to our Webhook integration.
          Receive Phrase Strings notifications in your chat tool, project management
          tool, or via an external API. Speed up your localization by cutting off
          time-consuming manual processes.
        title: Webhook integration
      wordpress:
        description: Sync your Wordpress content with Phrase
        subtitle: Switch to our %{plan_name} plan and receive our WordPress integration.
          Attract organic traffic from international markets and increase your conversion
          rates with multilingual content on WordPress. Access all Phrase Strings
          features with the WordPress integration to deliver the highest translation
          quality.
        title: WordPress integration
      workflow:
        description: The advanced review workflow lets you assign dedicated translators
          & reviewers to translation jobs.
        subtitle: Switch to our %{plan_name} plan and get access to the advanced review
          workflow. This feature will allow you to implement a workflow that, by default,
          requires content to be reviewed by assigned proofreaders. Achieve the highest
          level of translation quality for your content.
        title: Advanced review workflow
      zapier_integration:
        description: Connect Phrase Strings with any web app via Zapier
        subtitle: Switch to our %{plan_name} plan to receive our Zapier integration.
          Keep all stakeholders in the loop about what's going on in your localization
          projects! Easily customize which Phrase Strings events should trigger actions
          in other tools. Sending updates automatically to the tools used in your
          team can be a big time-saver.
        title: Zapier integration
