        </li>
      </ol>

      <h3>Section 11: Customer References, Granting of Rights</h3>
      <p>
        The customer grants Phrase the right, which is freely revocable at any time for the future, to use the names of the customer's company, products and services, as well as the customer’s logos and other company identifiers, as part of the services of Phrase as well as in other marketing materials concerning Phrase services, with reference to the customer relationship, but without Phrase being obliged to make such reference.
      </p>

      <h3>Section 12: Payments, Due Dates, Default, SEPA Presentation Period</h3>
      <ol class="terms-list">
        <li class="terms-list__item">
          Invoices shall be issued after conclusion of the contract. Phrase is also entitled to issue invoices purely electronically. Payments are due immediately upon receipt of the invoice and in advance without any deduction. If the customer is in arrears in regard to payments, or exceeds the limits of the plan booked by them after being warned to this effect, for a period of fourteen (14) calendar days or more, Phrase may – at its choice – discontinue the provision of services as a whole or in part, as well as initiate legal dunning procedures or legal proceedings concerning all existing obligations. Payment is deemed to be made as soon as Phrase can actually dispose of the amount due (in the case of checks: the date on which the amount is credited without reservation).
        </li>
        <li class="terms-list__item">
          In the event of default, Phrase shall charge default interest pursuant to section 288 II BGB (German civil code).
        </li>
        <li class="terms-list__item">
          If a check is not honored or payments are ceased, Phrase is entitled to declare all remaining debts to be due immediately – including by check. Returned direct debits shall result in all claims against the customer becoming due immediately; such returned direct debits shall be billed in the amount of the actually incurred costs, but at least in the amount of €10.00 in each case. A shortening of the SEPA presentation period (pre-information period for SEPA direct debiting) to one (1) day is hereby agreed. The customer can only offset their counterclaims that are either undisputed or have been ruled on finally and conclusively by a court of law.
        </li>
      </ol>

      <h3>Section 13: Adjustment of Prices</h3>
      <p>
        In order to maintain a balanced relationship between performance and consideration, particularly in long-term contracts, Phrase reserves the right to adjust the pricing of its plans or any additional services to its own higher costs one time per calendar year, at the beginning of the renewal period, by up to 20 percent, alternatively in line with development of the consumer price index of the month of invoicing.
      </p>
      <p>
        Phrase shall give the customer two months’ advance notice of a change in text form. The change shall be deemed to have been agreed if the customer does not object in text form within three weeks of receiving notice of the change. If the customer objects to the change, Phrase shall have an extraordinary right to terminate the contract. Such termination shall be effective as of the date from which the change is to apply. Phrase shall separately point out the deadline and the legal consequences of failing to meet it in the notice.
      </p>

      <h3>Section 14: Data Processing, Assignment of Rights</h3>
      <ol class="terms-list">
        <li class="terms-list__item">
          Phrase shall
          <ol type="a">
            <li class="terms-list__item">
              process any personal data provided by the customer only subject to the customer’s written instruction, unless (i) the personal data must be processed to perform the contract or administer access rights to the services, (ii) the personal data must be processed to monitor and scale use of the services so as to enable efficient allocation of resources to the customer, (iii) Phrase is obliged to process the personal data entered by the customer in the services, or (iv) Phrase is legally entitled for other reasons to process personal data;
            </li>
            <li class="terms-list__item">
              ensure that Phrase has suitable technical and organisational measures in place to protect personal data against unauthorized or unlawful processing.
            </li>
            <li class="terms-list__item">
              conclude an agreement on commissioned data processing with the customer if this is required in individual cases due to the statutory provisions or the specific subject matter of the agreed services.
            </li>
            </ol>
        </li>
        <li class="terms-list__item">
          Phrase shall be permitted to create analyses using information obtained by Phrase through the customer’s use of the Services. The data shall be anonymised and aggregated for such analyses. The data in such analyses may be used for improving the quality of products, resource optimization, and research into and development of new products; for improving performance and reviewing data security and integrity: and for data products, such as industry trends and anonymous benchmarking.
        </li>
      </ol>

      <h3>Section 15: Amendments to the GTCs</h3>
      <p>
        These GTCs may be amended for existing contractual relationships. Amendments shall be proposed to the customer in text form no later than two months before the date on which they are to take effect. The customer’s consent to the proposal shall be deemed to have been granted they do not reject the proposal in text form within two weeks of receiving it. If the customer rejects the proposal, Phrase shall have an extraordinary right to terminate the contract. Such termination shall be effective as of the date from which the change is to apply. In the proposal, Phrase shall separately point out the deadline to the customer and the fact that failure to meet it will denote consent to the proposal.
      </p>

      <h3>Section 16: Choice of Law, Place of Performance, Place of Jurisdiction, Requirement for Text Form</h3>
      <p>
