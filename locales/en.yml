  terms:
    content: |-
      <h3>Section 1: Scope of Application</h3>
      <ol class="terms-list">
        <li class="terms-list__item">
          These general terms and conditions (GTCs) are an integral part of and the sole basis for all contractual relationships, whether they relate to services that are free of charge or paid for, between Memsource GmbH (formerly Dynport GmbH) as the provider and operator of Phrase.com (hereinafter referred to as “Phrase”) and its customers. Conflicting terms and conditions of the customer do not apply even if Phrase has not expressly rejected such terms and conditions and/or renders its services without reservation in knowledge of the customer’s terms and conditions.
        </li>
        <li class="terms-list__item">
          By registering for Phrase, the customer affirms that they are not a consumer, but an entrepreneur and merchant within the meaning of the German commercial code (“Handelsgesetzbuch”).
        </li>
      </ol>

      <h3>Section 2: Definitions</h3>
      <p>
        “Services” or “Phrase Services” denotes all translation and localisation services and platforms offered by Phrase and provided in data networks or on data carriers.
      </p>
      <p>
        “Plan” denotes the scope of the Phrase services booked by the customer, as defined in more detail by the number of authorized users, the volume of managed words or other parameters.
      </p>
      <p>
        “Content” denotes all materials, data and information uploaded by the customer or any other third party to whom the customer has provided access to Phrase services.
      </p>

      <h3>Section 3: Conclusion of Contracts</h3>
      <p>
        A contract is concluded when Phrase either explicitly gives the customer confirmation of the booking of a plan or other services in writing, in text form or by way of an appropriate online dialogue, or by means of unambiguous behavior to that effect (e.g. by commencing to render its services).
      </p>

      <h3>Section 4: Services, Subject Matter of the Contract</h3>
      <ol class="terms-list">
        <li class="terms-list__item">
          Phrase shall provide its services to the customer within the scope in accordance with the customer’s booked plan. The creation and maintenance of a data connection between the customer’s systems and the transfer point operated by Phrase is not the responsibility of Phrase.
        </li>
        <li class="terms-list__item">
          Phrase strives to constantly improve and update its services. If this process requires technical changes to the services, Phrase shall notify the customer of this at least four weeks before the change date and shall provide the customer with all necessary information regarding any technical adjustments necessary on the customer’s side.
        </li>
        <li class="terms-list__item">
          Phrase warrants an annual average of 99.0 percent availability for its services.
        </li>
      </ol>

      <h3>Section 5: Term, Termination</h3>
      <p>
        The term of the contract is determined by the plan chosen. A plan can be terminated any time, effective at the end of the agreed minimum term. Otherwise, the term of the contract shall be extended by an additional period corresponding to the agreed minimum term in each case, unless terminated by one of the parties effective to the end of the respective contractual term. If the minimum term is longer than one year, the renewal term shall be one year in each case. Notice of termination may be given by letter, fax, or email or via a button for this purpose in the Phrase application.
      </p>

      <h3>Section 6: Particular Obligations of the Customer</h3>
      <ol class="terms-list">
        <li class="terms-list__item">
          The customer shall keep its access data to the Phrase services secret and shall not disclose it to unauthorised third parties. If the customer has reason to believe that an unauthorised person has gained knowledge of their access data, the customer has to change their access data immediately. The customer ensures that their use of the services shall not impair the working order of the services. The customer shall maintain appropriate standards of security for using the services.
        </li>
        <li class="terms-list__item">
          The customer is committed to carry out a regular, at least daily, data backup of all their content in order to reduce the risk of losing data permanently.
        </li>
        <li class="terms-list__item">
          The customer is committed to have appropriate insurance coverage for damage caused by data loss for all of their projects conducted using Phrase services.
        </li>
        <li class="terms-list__item">
          The customer shall be responsible for the content; in particular, they shall be responsible for ensuring that any personal data is allowed to be transferred to Phrase in compliance with applicable data protection laws. Moreover, the customer warrants that their content is legally unobjectionable and is virus-free, for which the customer is liable according to general laws. In particular, the customer undertakes not to upload any content that violates prevailing laws or infringes third-party rights. In addition, the customer shall indicate their advertising content on the websites that the customer maintains using the Phrase services, insofar as editorial and advertising contributions are mixed, and shall clarify that the customer is themselves responsible for the contents of these websites.
        </li>
        <li class="terms-list__item">
          If claims against Phrase are asserted because of the customer’s non-compliance with one of the obligations stipulated above, the customer shall, upon first request, indemnify and hold harmless Phrase from all claims by third parties, while waiving the defense of unexhausted remedies. The customer shall bear the reasonable costs of legal defense incurred by Phrase. Phrase may then also terminate the services it provides with immediate effect, or block and/or terminate plans, or remove the content in question without being obliged to repay already paid fees. This section 6 No. 5 shall not apply if the customer can prove that they are not (partially) to blame for the violation.
        </li>
      </ol>

      <h3>Section 7: Warranty</h3>
      <p>
        The warranty covers primarily remedying defects, for which the customer shall allow Phrase a reasonable period of time. If, after two unsuccessful attempts, such a remedy fails, the customer may reduce the remuneration or terminate the contract extraordinarily. The parties hereby agree to shorten the limitation period for defects in performance by Phrase to 12 months, as long as such defects are not due to willful intent.
      </p>

      <h3>Section 8: Impairment of Performance, Disclaimer</h3>
      <ol class="terms-list">
        <li class="terms-list__item">
          Liability for brief or insignificant disruptions to the services or for disruptions to them that cannot be influenced by Phrase is excluded. Liability is also excluded for any impairments in the performance of obligations during planned maintenance work of which the customer has been given prior notice in good time. Any such impairment shall not entitle the customer to reduce the remuneration, terminate the contract or assert claims for compensation. Faults and defects must be reported immediately so that they can be rectified. Claims due to defects which are not reported to Phrase by the customer in writing, in text form or by e-mail within two weeks of the customer being able to learn of them for the first time shall be excluded.
        </li>
        <li class="terms-list__item">
          In all cases of contractual and non-contractual liability, Phrase shall pay damages or reimburse futile expenses only within the scope defined in the following:
          <ol type="a">
            <li class="terms-list__item">
              Phrase shall be liable to an unlimited amount in the case of willful intent, gross negligence, damage to health or bodily injury, violations of the relevant product liability law, and the lack of a quality explicitly guaranteed by Phrase. In the event of a lack of a guaranteed quality, however, Phrase’s liability shall be limited to the amount of foreseeable damage that was intended to be prevented by the guaranteed quality.
            </li>
            <li class="terms-list__item">
              In all other cases, Phrase shall only be liable if it violates a cardinal contractual obligation. A violation of a cardinal contractual obligation within the meaning of this provision shall exist in the event of a violation of a contractual obligation whose fulfillment is vital to the proper performance of the contract, or whose violation jeopardizes achievement of the contract’s purpose, or which the customer may usually rely on to be complied with.
            </li>
            <li class="terms-list__item">
              In the cases defined in section 8 no. 2 letter b), liability shall be limited to 25% of the planned fee for the intended plan.
            </li>
            <li class="terms-list__item">
              Phrase accepts no liability whatsoever if the customer exclusively uses services that are free of charge. Any liability if services are used for testing shall likewise be excluded, since the customer’s objective in using the trial version is specifically to examine and establish whether the services meet their requirements.
            </li>
          </ol>
        </li>
        <li class="terms-list__item">
          Phrase reserves the right to claim contributory negligence (e.g. violation by the customer of its obligations in accordance with section 6 of these GTCs).
        </li>
        <li class="terms-list__item">
          The limitation period for liability claims against Phrase shall be reduced to 12 months, unless a case as defined in section 8 no. 2, letter a) exists.
        </li>
      </ol>

      <h3>Section 9: Acceptance</h3>
      <p>
        Contractual Services are deemed accepted upon use of the services, but no later than ten (10) days after the services are made available, unless the customer reports a defect that prevents acceptance within the ten (10) days.
      </p>

      <h3>Section 10: Rights of use</h3>
      <ol class="terms-list">
        <li class="terms-list__item">
          Copyrights held by the customer for its content shall not be affected by use of the services. Any right to use that content shall be transferred to Phrase only where necessary for Phrase to be able to provide its services agreed under the booked plan for the customer.
        </li>
        <li class="terms-list__item">
          Copyrights to the services shall remain solely with Phrase; the customer shall only be granted a simple, non-transferable right to use the services within the scope corresponding to the contract’s purpose and booked plan.
        </li>
        <li class="terms-list__item">
