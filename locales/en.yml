      user_roles_and_access_control: Organize your localization team by assigning
        dedicated roles and access rights to each team member according to projects
        and languages.
      version_control_tools: Sync your Phrase projects with your GitHub, GitLab, or
        Bitbucket repositories effortlessly.
      webhook_integration: Receive Phrase Strings notifications in your chat tool
        (e.g. Slack), project management tool, or via an external API.
      wordpress: Translate WordPress pages in Phrase Strings. Access all Phrase features
