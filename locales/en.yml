      2fa: Raise your security standards and include two-factor authentication, whether
        via 2FA token or OAuth access token.
      activity_tracking: Know what's going on in your projects by monitoring all the
        latest activities and filter them according to users, events, and specific
        time intervals.
      advanced_api: Adjust Phrase to your workflow. Interact with translation keys,
        jobs, term bases, screenshots, and more through our powerful API.
      advanced_review_workflow: Implement a workflow that, by default, requires content
        to be reviewed by assigned proofreaders.
      advanced_search: Find translation keys faster by searching for specific content,
        key names, and/or tags.
      advanced_textmaster_integration: Connect Phrase Strings to your TextMaster account
        for 100% customizable translation orders. Unlock discounts and access advanced
        settings to increase translation quality.
      autofill: Let Phrase translate new content automatically using translation memory
        and machine translation.
