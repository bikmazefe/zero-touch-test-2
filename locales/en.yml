        locale files, download locale files, create translation orders, or interact
        in other ways with translations stored in Phrase for your account.
      basic_review_workflow: Translations for which the source content has changed
        are automatically marked as unverified. You can filter unverified translations
        and request verification.
      basic_search: Find the key you need with a single-line keyword search.
      batch_actions: Select multiple keys to perform batch actions, e.g. verifying
        or tagging multiple keys at once
      branching: Work on multiple releases and versions at the same time - just like
        in Git.
      checks: Check all your translations for common issues like overly long wording,
        broken placeholders, or mistranslated terms.
      command_line_tool: Navigate your projects and translations quickly from your
        command line.
      comments_and_mentionings: Inform, discuss, or ask team members questions regarding
        specific translations by commenting on individual keys. Mention team members
        in your comment to address your message to specific people.
      contentful_integration: Combine the strength of Phrase and Contentful! Use Phrase
        Strings to organize your translation process and deliver high-quality translations.
        Access your translations from within Contentful for publication on multiple
        channels.
      custom_contracts: Get a custom contract tailored to your compliance requirements.
      custom_integrations: Request a new integration that is customized to your needs.
      custom_sla: Our highest level of uptime commitment provides you with the most
        stable Phrase Strings experience.
      custom_user_roles: Mix and match access rights according to your needs and get
        your custom user role built for you by our Customer Success team.
      figma: An effortless UI translation experience. Sync design content between
        Figma and Phrase Strings.
      file_format_conversion_and_syntax_validation: Avoid broken language files through
        Phrase Strings' validation check.
      file_formats: Choose from a huge variety of ways to export and import your translations
        and access our API.
      glossary: Stay consistent throughout all languages. Our term base is a list
        of predefined terms unique to your business that remain unaltered throughout
        all languages.
      history: You can see all previous versions of a translation in the changes tab
        of our translation editor.
      hmi_formats: Localization of Human Machine Interfaces can require specific formats.
        Request the format you need to be developed by our team!
      in_context_editor: Translate with maximum context. See in real-time what translations
        would look like on your website.
      iso_and_tisax: Guarantees one of the highest international standards in information
        security.
      jira_integration: Trigger Jira issues from Phrase events! Get notified of started
        and completed translation jobs directly in Jira.
      jobs: Organize all your translation tasks by assigning team members, providing
        descriptions, and setting due dates to the languages of your choice.
      key_tagging: Add tags to keys for more refined tracking within your project.
      notifications: Always stay informed about all the latest changes in your project
        through notifications directly in Phrase and via email.
      over_the_air: Publish and preview mobile app translations in real-time directly
        from Phrase.
      personal_account_manager: Your point of contact within Phrase helps you continuously
        optimize your localization workflows.
      personal_onboarding_support: Providing you with personal assistance throughout
        your Phrase set-up process, including individual product demos and technical
        integration aids.
      project_based_user_roles: Define access rights even more granularly by assigning
        different user roles for different projects.
      reports: Stay informed about your team members‘ performance, including the amount
        of translated words, keys and much more.
      saml_single_sign_on: Get access to Phrase conveniently via SAML with an identity
        provider of your choice.
      screenshots: Increase the contextual information by attaching screenshots to
        your translation keys.
      sketch: Sync your designs from Sketch with Phrase Strings and integrate localization
        into your design process.
      slack: Keep all stakeholders informed about translation projects by connecting
        Phrase with Slack.
      smart_suggest: Use real-time suggestions for translations while you’re translating
        in the Phrase Strings editor. Speed up your translation work and improve your
        overall consistency.
      source_copy_editing: Edit your source language files directly in Phrase.
      spaces: 'Clustering your localization projects into spaces is a great time-saver. '
      teams: Assign access rights to entire teams instead of defining them for each
        individual user.
      translation_editor: Use our browser-based and user-friendly editor to do the
        actual translation work.
      translation_memory: Speed up your localization process with our translation
        memory. The translation memory remembers translations used in your projects
        and suggests matching results.
      translation_ordering: Work with your own team of translators or simply order
