  feature:
    teaser:
      activity_stream:
        description: Durch unsere filterbare Aktivitätsübersicht kannst du Projektänderungen
          transparent nachverfolgen und zuordnen.
        subtitle: Wechsle zu unserem %{plan_name} Plan, um Zugang zu Aktivität zu
          bekommen. Diese Funktion ermöglicht es dir, Aktivitäten zu überwachen und
          nach Benutzern, Ereignissen oder bestimmten Zeitintervallen zu filtern.
          Alles an einem zentralen Ort gesammelt, damit du alle Informationen so schnell
          wie möglich erhältst.
        title: Aktivitätsdaten Strom
      advanced_search:
        description: Stelle komplexere Suchanfragen oder aktiviere die Groß-/Kleinschreibung
          mit der Erweiterten Suche.
        subtitle: 'Wechsle zu unserem %{plan_name} Plan, um die Erweiterte Suche zu
          nutzen. Kombiniere die Stichwortsuche nach Inhalt, Keyname und/oder Tags,
          um Keys schneller zu finden. '
        title: Erweiterte Suche
      advanced_workflows:
        description: Überprüfen Sie automatisch jede neue oder aktualisierte Übersetzung,
          so dass jede Übersetzung überprüft werden kann, um Ihre Übersetzungsqualität
          zu erhöhen.
        subtitle: Wechsle zu unserem %{plan_name} Plan und erhalte Zugriff auf den
          Advanced Review Workflow. Mit dieser Funktion kannst du einen Prozess festlegen,
          der standardmäßig die Überprüfung von Inhalten durch zugewiesene Korrekturleser*innen
          erfordert. So lieferst du top Übersetzungsqualität für deine Inhalte.
        title: Advanced Review Workflow
      automations:
        description: Automatisieren Sie Ihren Lokalisierungsprozess, indem Sie Regeln
          festlegen, die die Auftragserstellung auslösen.
        subtitle: Wechseln Sie zu unserem Plan %{plan_name}, um auf die Automatisierung
          zuzugreifen. Automatisieren Sie Ihren Lokalisierungsprozess, indem Sie Regeln
          festlegen, die die Erstellung von Aktionen auslösen. Diese Funktion spart
          Ihnen wertvolle Zeit, indem Sie sich wiederholende Aufgaben automatisieren.
        title: Automatisierungen
      autopilot:
        description: Benutze die Vorübersetzung um neue Keys, Sprachen oder Uploads
          direkt nach dem Hochladen in Phrase automatisch in mehrere Sprachen übersetzen
          zu lassen. Die Vorübersetzung übersetzt neue Inhalte mittels Translation
          Memory und Maschinenübersetzung.
        subtitle: Wechsle zu unserem %{plan_name} Plan und nutze Vorübersetzung. Lass
          neue Inhalte automatisch mithilfe von Translation Memory und maschineller
          Übersetzung übersetzen und beschleunige so deinen Lokalisierungsprozess.
        title: Vorübersetzung
      batch_actions:
        description: Wähle mehrere Keys aus und wende Änderungen mit einem Klick auf
          alle ausgewählten Keys an.
        subtitle: Wechsle zu unserem %{plan_name} Plan und erhalte Zugriff auf Batch
          Actions. Du kannst mehrere Keys auswählen, um Batch Actions durchzuführen,
          z. B. das Verifizieren oder Taggen mehrerer Keys auf einmal. Mit dieser
          Funktion sparst du viele manuelle Arbeitsschritte.
        title: Batch Actions
      bitbucket_sync:
        description: Importiere und exportiere Sprachdateien schneller denn je mit
          einer nativen Integration in Bitbucket.
        subtitle: Wechsle zum %{plan_name} Plan und erhalte Zugang zu unserem Bitbucket
          Sync. Mit dieser Funktion kannst du deine Projekte in Phrase ganz einfach
          mit deinen Bitbucket-Repositories synchronisieren und die Arbeit des Entwicklungsteams
          beschleunigen, da manuelle Prozesse wegfallen.
        title: Bitbucket Sync
      branching:
        description: Arbeiten Sie an mehreren Releases und Versionen gleichzeitig-genau
          wie in git.
        subtitle: Wechsle zu unserem %{plan_name} Plan, um Zugriff auf unsere Branching-Funktion
          zu erhalten. So kannst du an mehreren Releases und Versionen zur gleichen
          Zeit arbeiten, genau wie in Git. Diese Funktion erhöht die Sicherheit, wenn
          du an mehreren Projekten gleichzeitig arbeitest.
        title: Verzweigung
      checks:
        description: Erhalte schnell eine Übersicht über alle Translation Keys, die
          die maximale Zeichenlänge nicht einhalten, oder Platzhalter und Termbankeinträge
          falsch verwenden. In den Einstellungen kannst du auch festlegen, dass Übersetzungen
          nur gespeichert werden können, wenn alle Regeln eingehalten werden.
        subtitle: Verbessere deinen Übersetzungsprozess mit unserer Qualitätssicherung!
          Wechsle zum %{plan_name} Plan und lass Phrase alle deine Übersetzungen auf
          häufige Probleme, wie zu lange Formulierungen, kaputte Platzhalter oder
          falsch übersetzte Termbankeinträge prüfen.
        title: Qualitätssicherung (QA)
      contentful:
        description: Synchronisiere deine Contentful Inhalte mit Phrase
        subtitle: Wechsle zu unserem %{plan_name} Plan, um die Contentful Integration
          zu nutzen. So kombinierst du die Stärken von Phrase und Contentful! Nutze
          Phrase, um deinen Übersetzungsprozess zu organisieren und hochwertige Übersetzungen
          zu liefern. Greife auf deine Übersetzungen aus Contentful zu, um sie schnell
          auf mehreren Kanälen zu veröffentlichen.
        title: Contentful Integration
      figma:
        description: Synchronisiere Designtexte zwischen Figma und Phrase
        subtitle: Wechsle zum %{plan_name} Plan und nutze unsere Figma Integration,
          um Keys und Jobs direkt aus Figma heraus zu erstellen. Screenshots werden
          automatisch angehängt und sorgen für qualitativ hochwertige Übersetzungen.
          Nie wieder Designbrüche und verzögerte Releases!
        title: Figma Integration
      github_sync:
        description: Synchronisiere Sprachdateien aus deinem Repository mit Phrase
          Strings. Exportiere Übersetzungen als Pull-Request zu GitHub.
        subtitle: Wechsle zu unserem %{plan_name} Plan, um auf die GitHub-Integration
          zuzugreifen. Synchronisiere deine Projekte in Phrase ganz einfach mit deinen
          GitHub-Repositories. Du sparst wertvolle Entwicklerzeit, indem du manuelle
          Prozesse abschaffst.
        title: GitHub-Sync
      gitlab_sync:
        description: Sende Sprachdateien automatisch zu Phrase und exportiere Übersetzungen
          zurück in dein Repository.
        subtitle: Wechsle zum %{plan_name} Plan und erhalte Zugang zu unserem GitLab
          Sync. Synchronisiere deine Projekte in Phrase ganz einfach mit deinen GitLab-Repositories
          und spare wertvolle Entwicklungszeit.
        title: GitLab Sync
      glossary:
        description: Stelle eine einheitliche Kommunikation in allen Sprachen sicher.
          Eine Termbank ist eine Sammlung an Begriffen, die für dein Unternehmen wichtig
          sind. Definiere für jeden Begriff, wie er übersetzt werden soll.
        subtitle: Wechsle zu unserem %{plan_name} Plan, um Termbanken zu nutzen. Definiere
          Begriffe, die für dein Unternehmen oder deine Marke wichtig sind, damit
          sie in allen Sprachen richtig übersetzt werden. Mit dieser Funktion kannst
          du eine hohe Übersetzungsqualität sicherstellen.
        title: Termbank
      history:
        description: Sieh sämtliche Änderungen an deinen Übersetzungen in der Änderungshistorie
          unter dem Reiter "Änderungen".
        subtitle: Wechsle zu unserem %{plan_name} Plan, um die Änderungshistorie zu
          nutzen. So siehst du alle früheren Versionen einer Übersetzung im Translation
          Editor. Du kannst bei Bedarf einfach zu einer früheren Version zurückkehren,
          um Übersetzungen in höchster Qualität zu gewährleisten.
        title: Änderungen
      in_context_editor:
        description: Übersetzen Sie direkt auf Ihrer Website und sehen Sie alle Übersetzungen
          in Ihrem eigentlichen Kontext.
        subtitle: 'Wechsle zu unserem %{plan_name} Plan und erhalte unseren In-Context
          Editor, um mit maximalem Kontext zu übersetzen. Du siehst in Echtzeit, wie
          die Übersetzungen auf deiner Website aussehen würden, um hochwertige Übersetzungen
          deiner Inhalte zu gewährleisten. '
        title: In-context Editor
      jira:
        description: Verbinde Jira mit Phrase, um auf beiden Plattformen immer auf
          dem neuesten Stand zu sein.
        subtitle: Wechsle zu unserem %{plan_name} Plan, um die Jira Integration zu
          nutzen. Verknüpfe Übersetzungs-Jobs mit den dazugehörigen Jira-Tickets,
          um den Fortschritt der Übersetzung direkt in Jira zu sehen. Das erhöht die
          Transparenz und beschleunigt deinen Lokalisierungsprozess.
        title: Jira Integration
      job_templates:
        description: Erstellen Sie schneller als je zuvor perfekte Übersetzungsaufträge.
          Speichern Sie Vorlagen für einen bestimmten Satz von Sprachen mit zugewiesenen
          Übersetzern.Implementieren Sie ganz einfach einen hohen Standard für Stellenbeschreibungen
          mit wiederverwendbaren benutzerdefinierten Vorlagen.
        subtitle: Erstellen Sie schneller als je zuvor perfekte Übersetzungsaufträge.
          Speichern Sie Vorlagen für einen bestimmten Satz von Sprachen mit zugewiesenen
          Übersetzern.Implementieren Sie ganz einfach einen hohen Standard für Stellenbeschreibungen
          mit wiederverwendbaren benutzerdefinierten Vorlagen.
        title: Jobs Templates
      jobs:
        description: Organisieren Sie alle Ihre Übersetzungsaufgaben, indem Sie Teammitglieder
          zuweisen, Beschreibungen bereitstellen und Fälligkeitstermine für die Sprachen
          Ihrer Wahl festlegen.
        subtitle: Wechseln Sie zu unserem %{plan_name}-Plan, um Zugriff auf unsere
          Jobfunktion zu erhalten. Organisieren Sie Ihre Übersetzungsaufgaben, indem
          Sie Teammitglieder zuweisen, Beschreibungen bereitstellen und Fälligkeitstermine
          festlegen. Sparen Sie Zeit mit dieser effizienten Art der Organisation von
          Übersetzungsarbeiten.
        title: Jobs
      ota:
        description: Warte nicht mehr auf das nächste Deployment und veröffentliche
          alle deine Übersetzungen in Echtzeit direkt in Phrase Strings.
        subtitle: Wechsle zu unserem %{plan_name} Plan und nutze das Over the Air
          Feature. Mit Over the Air kannst du deine Übersetzungen für mobile Anwendungen
          schneller und einfacher als je zuvor veröffentlichen. Du musst nicht mehr
          auf die nächste Bereitstellung warten, sondern kannst alle Übersetzungen
          in Echtzeit direkt in Phrase veröffentlichen.
        title: Über die Luft
      repo_sync:
        description: Synchronisiere Sprachdateien von deinem Repository mit Phrase
          Strings. Exportiere Übersetzungen als Pull-Request in deine bevorzugten
          Git Hosting-Dienstleistung.
        subtitle: Wechse zu unserem %{plan_name}-Plan, um auf unsere Git Sync-Integration
          zu zugreifen.  Synchronisiere deine Phrase Strings-Projekte ganz einfach
          mit deinen Online-Git-Repositories. Spare wertvolle Zeit der Entwickler,
          indem du manuell Prozesse unterbindest.
        title: Git Synchronisierung
      reporting:
        description: Werte die Anzahl an verifizierten und übersetzten Wörtern pro
          User aus und erhalte einen Überblick über den Fortschritt deiner Übersetzung.
          Greife auf Statistiken der Vorübersetzung zu, um die Vorübersetzung für
          deinen individuellen Übersetzungsprozess zu optimieren.
        subtitle: Wechsle zu unserem %{plan_name} Plan und erhalte Zugang zu Statistiken.
          So bleibst du stets über die Arbeit deines Übersetzungsteams informiert,
          einschließlich der Anzahl übersetzter Wörter, Keys und vielem mehr.
        title: Reporting
      screenshots:
        description: Erhöhen Sie die Kontextinformationen, indem Sie Screenshots an
          Ihre Übersetzungsschlüssel anfügen.
        subtitle: Wechsle zu unserem %{plan_name} Plan, um die Screenshots-Funktion
          zu nutzen. Indem du Screenshots an deine Keys anhängst, gibst du Übersetzern
          den richtigen Kontext und ermöglichst es ihnen, qualitativ hochwertige Übersetzungen
          zu liefern.
        title: Aufsteckbarer Screenshots
      sketch:
        description: Synchronisiere deine Designinhalte aus Sketch mit Phrase Strings.
        subtitle: Wechsle zu unserem %{plan_name} Plan, um die Sketch Integration
          zu nutzen. Synchronisiere deine Designs aus Sketch mit Phrase und integriere
          die Lokalisierung in deinen Designprozess. Das Übersetzungsteam kann bereits
          mit der Arbeit beginnen, während das Entwicklerteam an deinem Feature arbeitet.
          Indem du die fertigen Übersetzungen in Sketch überprüfst, vermeidest du
          Designbrüche im fertigen Produkt.
        title: Sketch Integration
      slack:
        description: Sende Phrase events in Slack-Channels
        subtitle: Wechsle zu unserem %{plan_name} Plan und nutze die Slack Integration,
          um Benachrichtigungen in Slack zu erhalten. Halte alle Beteiligten über
          Übersetzungsprojekte auf dem Laufenden und beschleunige die Kommunikation,
          indem du Phrase mit Slack verbindest.
        title: Slack Integration
      smart_suggest:
        description: Erhalte Übersetzungsvorschläge in Echtzeit während du im Translation
          Editor übersetzt. Automatische Vervollständigung beschleunigt deine Übersetzungsarbeit.
        subtitle: Wechsle zum %{plan_name} Plan und erhalte Übersetzungsvorschläge
          in Echtzeit! Mit der automatischen Vervollständigung beschleunigst du deine
          Übersetzungsarbeit.
        title: Automatische Vervollständigung
      spaces:
        description: Deine Lokalisierungsprojekte in Spaces zu gruppieren spart viel
          Zeit.
        subtitle: Wechsle zu unserem %{plan_name} Plan und nutze Spaces. Durch das
          Gruppieren deiner Projekte in Spaces sparst du viel Zeit. Du kannst Usern
          Zugriff auf einen ganzen Space geben, anstatt Projekte einzeln auszuwählen.
          Außerdem helfen Spaces dabei, schneller durch die Projekte zu navigieren.
        title: Räume
      sso:
        description: Verwalte den Zugang zu Phrase Strings bequem über SAML, mit einem
          Identity Provider deiner Wahl.
        subtitle: Wechsle zu unserem %{plan_name} Plan, um Single Sign-On zu nutzen.
          Ermögliche deinem Team einen einfachen Zugriff auf Phrase mit Single Sign-On
          und mache Sicherheit zur obersten Priorität.
        title: Single Sign-On
      teams:
        description: Skaliere die Anzahl der Projekte, Sprachen und User in Phrase
          mit Teams, ohne dir Sorgen über aufwendige User-Verwaltung machen zu müssen.
        subtitle: Wechsle zu unserem %{plan_name} Plan und verwalte Zugriffsrechte
          effizient mit dem Teams Feature! Du kannst Zugriffsrechte für ein ganzes
          Team definieren, anstatt sie für jedes neue Teammitglied wieder manuell
          festzulegen.
        title: Teams
      translation_memory:
        description: Beschleunigen Sie Ihren Lokalisierungsprozess mit unserem Translation
          Memory. Das Translation Memory merkt sich die in Ihren Projekten verwendeten
          Übersetzungen und schlägt passende Ergebnisse vor.
        subtitle: Wechsle zu unserem %{plan_name} Plan und nutze die Translation Memory
          Funktion. Alle deine Übersetzungen werden gespeichert und stehen für die
          Vorübersetzung zur Verfügung. Mit Translation Memory machst du höchste Übersetzungsqualität
          und Konsistenz für deine Inhalte möglich.
        title: Translation Memory
      verification_system:
        description: Benachrichtigen Sie Ihre Übersetzer automatisch über Änderungen
          in der Quellsprache und fordern Sie eine Überarbeitung der übersetzten Schlüssel
          an, um eine konsistente Kommunikation in allen Sprachen zu gewährleisten.
        subtitle: Wechsle zu unserem %{plan_name} Plan und erhalte Zugriff auf den
          Einfachen Review Workflow. Wenn sich der Text in der Ausgangssprache ändert,
          werden Übersetzungen automatisch als nicht verifiziert markiert. Du kannst
          nach nicht verifizierten Übersetzungen filtern und die Überprüfung durch
          einen Übersetzer anfordern.
        title: Einfacher Review Workflow
      webhook_integration:
        description: Erstelle deine individuelle Webhook Integration, indem du Benachrichtigungen
          an externe Dienste, z.B. Chat-Tools, sendest.
        subtitle: Wechsle zu unserem %{plan_name} Plan, um Zugang zu Webhooks zu erhalten.
          Empfange Benachrichtigungen aus Phrase in deinem Chat-Tool, Projektmanagement-Tool
          oder über eine externe API. Beschleunige deine Lokalisierung, indem du zeitaufwändige
          manuelle Prozesse abschaffst.
        title: Webhook Integration
      wordpress:
        description: Synchronisiere deine WordPress-Inhalte mit Phrase
        subtitle: Wechsle zu unserem %{plan_name} Plan und nutze unsere WordPress
          Integration. Verbessere deine internationale organische Reichweite und steigere
          deine Conversion Rate mit mehrsprachigen Inhalten auf WordPress. Greife
          mit der WordPress-Integration auf alle Phrase-Funktionen zu, um die höchste
          Übersetzungsqualität zu liefern.
        title: WordPress Integration
      workflow:
        description: Mit dem Erweiterten Review Workflow kannst du die Übersetzung
          und das Überprüfen bestimmten Personen zuweisen.
        subtitle: Wechsle zu unserem %{plan_name} Plan und erhalte Zugriff auf den
          Advanced Review Workflow. Mit dieser Funktion kannst du einen Prozess festlegen,
          der standardmäßig die Überprüfung von Inhalten durch zugewiesene Korrekturleser*innen
          erfordert. So lieferst du top Übersetzungsqualität für deine Inhalte.
        title: Advanced Review Workflow
      zapier_integration:
        description: Verbinde Phrase Strings mit beliebig vielen Webanwendungen via
          Zapier
        subtitle: Wechsle zu unserem %{plan_name} Plan, um unsere Zapier Integration
          zu nutzen. Halte alle Beteiligten auf dem Laufenden, was in deinen Lokalisierungsprojekten
          vor sich geht! Du kannst ganz einfach anpassen, welche Phrase-Ereignisse
          Aktionen in anderen Tools auslösen sollen. Spare Zeit mit automatisierten
          Updates!
        title: Zapier Integration
