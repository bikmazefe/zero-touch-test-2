  terms:
    content: |-
      <h3>Abschnitt 1: Geltungsbereich</h3>
      <ol class="terms-list">
        <li class="terms-list__item">
          Diese Allgemeinen Geschäftsbedingungen (AGB) sind integraler Bestandteil und alleinige Grundlage aller Vertragsbeziehungen, unabhängig davon, ob sie sich auf unentgeltliche oder kostenpflichtige Leistungen zwischen der Memsource GmbH (ehemals Dynport GmbH) als Anbieter und Betreiber von Phrase.com (nachfolgend „Phrase“) und ihren Kunden beziehen.Entgegenstehende Geschäftsbedingungen des Kunden gelten nicht, auch wenn Phrase diesen Bedingungen nicht ausdrücklich widersprochen hat und/oder ihre Leistungen in Kenntnis der Geschäftsbedingungen des Kunden vorbehaltlos erbringt.
        </li>
        <li class="terms-list__item">
          Mit der Registrierung bei Phrase versichert der Kunde, dass er kein Verbraucher, sondern Unternehmer und Kaufmann im Sinne des Handelsgesetzbuches ist.
        </li>
      </ol>

      <h3>Abschnitt 2: Begriffsbestimmungen</h3>
      <p>
        „Dienste“ oder „Phrasendienste“ bezeichnet alle von Phrase angebotenen Übersetzungs- und Lokalisierungsdienste und Plattformen, die in Datennetzen oder auf Datenträgern bereitgestellt werden.
      </p>
      <p>
        „Plan“ bezeichnet den Umfang der vom Kunden gebuchten Phrase-Leistungen, wie er durch die Anzahl der berechtigten Benutzer, die Menge der verwalteten Wörter oder andere Parameter näher definiert wird.
      </p>
      <p>
        „Inhalt“ bezeichnet alle Materialien, Daten und Informationen, die vom Kunden oder einem anderen Dritten, dem der Kunde Zugang zu Phrase-Diensten gewährt hat, hochgeladen wurden.
      </p>

      <h3>Abschnitt 3: Vertragsschluss</h3>
      <p>
        Ein Vertrag kommt zustande, wenn Phrase dem Kunden die Buchung eines Plans oder anderer Leistungen entweder ausdrücklich schriftlich, in Textform oder über einen entsprechenden Online-Dialog oder durch eindeutiges Verhalten in diesem Sinne (z.B. durch den Beginn der Leistungserbringung) bestätigt.
      </p>

      <h3>§ 4: Leistungen, Vertragsgegenstand</h3>
      <ol class="terms-list">
        <li class="terms-list__item">
          Phrase erbringt seine Leistungen für den Kunden im Rahmen des vom Kunden gebuchten Plans.Die Herstellung und Pflege einer Datenverbindung zwischen den Systemen des Kunden und dem von Phrase betriebenen Übergabepunkt obliegt nicht Phrase.
        </li>
        <li class="terms-list__item">
          Phrase ist bestrebt, seine Dienstleistungen ständig zu verbessern und zu aktualisieren. Erfordert dieser Vorgang technische Änderungen an den Dienstleistungen, so wird Phrase den Kunden mindestens vier Wochen vor dem Änderungsdatum darüber informieren und ihm alle erforderlichen Informationen über die technischen Anpassungen auf Kundenseite zur Verfügung stellen.
        </li>
        <li class="terms-list__item">
          Phrase garantiert eine jährliche Verfügbarkeit von 99,0 Prozent für seine Dienste.
        </li>
      </ol>

      <h3>Abschnitt 5: Laufzeit, Kündigung</h3>
      <p>
        Die Laufzeit des Vertrages richtet sich nach dem gewählten Plan. Ein Plan kann jederzeit mit Wirkung zum Ende der vereinbarten Mindestlaufzeit gekündigt werden. Andernfalls verlängert sich die Laufzeit des Vertrages um eine zusätzliche Frist, die der jeweils vereinbarten Mindestlaufzeit entspricht, sofern sie nicht von einer der Parteien mit Wirkung zum Ende der jeweiligen Vertragslaufzeit gekündigt wird. Bei einer Mindestlaufzeit von mehr als einem Jahr beträgt die Verlängerungslaufzeit jeweils ein Jahr. Die Kündigung kann per Brief, Fax, E-Mail oder über einen Button in der Phrase-Anwendung zu diesem Zweck erfolgen.
      </p>

      <h3>Abschnitt 6: Besondere Pflichten des Kunden</h3>
      <ol class="terms-list">
        <li class="terms-list__item">
          Der Kunde hat seine Zugangsdaten zu den Phrase-Diensten geheim zu halten und nicht an unbefugte Dritte weiterzugeben. Hat der Kunde Grund zu der Annahme, dass eine unbefugte Person Kenntnis von seinen Zugangsdaten erlangt hat, hat der Kunde seine Zugangsdaten unverzüglich zu ändern. Der Kunde stellt sicher, dass deren Nutzung die Funktionsfähigkeit der Dienste nicht beeinträchtigt. Der Kunde hat angemessene Sicherheitsstandards für die Nutzung der Dienste einzuhalten.
        </li>
        <li class="terms-list__item">
          Der Kunde verpflichtet sich, eine regelmäßige, mindestens tägliche Datensicherung aller seiner Inhalte durchzuführen, um das Risiko des Datenverlustes dauerhaft zu verringern.
        </li>
        <li class="terms-list__item">
          Der Kunde verpflichtet sich, für alle seine Projekte, die mit Phrase-Diensten durchgeführt werden, einen angemessenen Versicherungsschutz für Schäden durch Datenverlust zu haben.
        </li>
        <li class="terms-list__item">
          Für die Inhalte ist der Kunde verantwortlich; insbesondere ist er dafür verantwortlich, dass personenbezogene Daten unter Beachtung der geltenden Datenschutzgesetze an Phrase übermittelt werden dürfen. Darüber hinaus sichert der Kunde zu, dass deren Inhalte rechtlich einwandfrei und virenfrei sind, wofür der Kunde nach den allgemeinen Gesetzen haftet. Insbesondere verpflichtet sich der Kunde, keine Inhalte hochzuladen, die gegen geltendes Recht verstoßen oder Rechte Dritter verletzen. Darüber hinaus hat der Kunde auf den Websites, die der Kunde unter Nutzung der Phrase-Dienste unterhält, soweit redaktionelle und werbliche Beiträge vermischt sind, auf seine Werbeinhalte hinzuweisen und klarzustellen, dass der Kunde selbst für die Inhalte dieser Websites verantwortlich ist.
        </li>
        <li class="terms-list__item">
          Werden Ansprüche gegen Phrase geltend gemacht, weil der Kunde einer der oben genannten Verpflichtungen nicht nachgekommen ist, so stellt der Kunde Phrase auf erstes Verlangen von allen Ansprüchen Dritter frei und hält sie schadlos, wobei er auf die Verteidigung unausgeschöpfter Rechtsmittel verzichtet. Der Kunde trägt die angemessenen Kosten der Rechtsverteidigung, die Phrase entstehen. Phrase kann dann auch die von ihm erbrachten Leistungen mit sofortiger Wirkung kündigen, Pläne sperren und/oder beenden oder die betreffenden Inhalte entfernen, ohne dass er zur Rückzahlung bereits gezahlter Gebühren verpflichtet ist. Dieser Abschnitt 6 Nr. 5 gilt nicht, wenn der Kunde nachweisen kann, dass er die Verletzung nicht (teilweise) zu vertreten hat.
        </li>
      </ol>

      <h3>Abschnitt 7: Gewährleistung</h3>
      <p>
        Die Gewährleistung erstreckt sich in erster Linie auf die Mängelbeseitigung, für die der Kunde Phrase eine angemessene Frist setzt. Schlägt diese nach zwei erfolglosen Versuchen fehl, kann der Kunde die Vergütung mindern oder den Vertrag außerordentlich kündigen. Die Parteien vereinbaren hiermit, die Verjährungsfrist für Leistungsmängel von Phrase auf 12 Monate zu verkürzen, soweit diese nicht auf Vorsatz beruhen.
      </p>

      <h3>§ 8: Leistungsbeeinträchtigung, Haftungsausschluss</h3>
      <ol class="terms-list">
        <li class="terms-list__item">
          Eine Haftung für kurzzeitige oder unerhebliche Störungen der Leistungen oder für Störungen derselben, die von Phrase nicht beeinflusst werden können, ist ausgeschlossen. Eine Haftung ist auch ausgeschlossen für Beeinträchtigungen der Erfüllung von Verpflichtungen bei geplanten Wartungsarbeiten, die dem Kunden rechtzeitig mitgeteilt wurden. Eine solche Beeinträchtigung berechtigt den Kunden nicht, die Vergütung zu mindern, den Vertrag zu kündigen oder Schadensersatzansprüche geltend zu machen. Mängel und Mängel sind unverzüglich anzuzeigen, damit sie behoben werden können. Ansprüche wegen Mängeln, die der Kunde nicht innerhalb von zwei Wochen nach Kenntniserlangung schriftlich, schriftlich oder per E-Mail an Phrase gemeldet hat, sind ausgeschlossen.
        </li>
        <li class="terms-list__item">
          In allen Fällen der vertraglichen und außervertraglichen Haftung leistet Phrase Schadensersatz oder ersetzt vergebliche Aufwendungen nur in dem nachfolgend definierten Umfang:
          <ol-Typ="a">
            <li class="terms-list__item">
              Bei Vorsatz, grober Fahrlässigkeit, Verletzung der Gesundheit oder des Körpers, Verstößen gegen das jeweilige Produkthaftungsgesetz und dem Fehlen einer von Phrase ausdrücklich garantierten Beschaffenheit haftet Phrase in unbegrenzter Höhe, bei Fehlen einer garantierten Beschaffenheit ist die Haftung von Phrase jedoch auf den vorhersehbaren Schaden begrenzt, der durch die garantierte Beschaffenheit verhindert werden sollte.
            </li>
            <li class="terms-list__item">
              In allen anderen Fällen haftet Phrase nur, wenn sie eine wesentliche Vertragspflicht verletzt. Eine Verletzung einer wesentlichen Vertragspflicht im Sinne dieser Bestimmung liegt vor, wenn eine Vertragspflicht verletzt wird, deren Erfüllung für die ordnungsgemäße Vertragserfüllung wesentlich ist oder deren Verletzung die Erreichung des Vertragszwecks gefährdet oder auf deren Einhaltung der Kunde in der Regel vertrauen darf.
            </li>
            <li class="terms-list__item">
              In den in § 8 Nr. 2 Buchstabe b) definierten Fällen ist die Haftung auf 25% des für den vorgesehenen Plan vorgesehenen Honorars begrenzt.
            </li>
            <li class="terms-list__item">
              Phrase übernimmt keinerlei Haftung, wenn der Kunde ausschließlich unentgeltliche Leistungen in Anspruch nimmt, ebenso ist jede Haftung bei der Inanspruchnahme von Leistungen zum Testen ausgeschlossen, da der Kunde mit der Nutzung der Testversion insbesondere prüfen und feststellen will, ob die Leistungen ihren Anforderungen entsprechen.
            </li>
          </ol>
        </li>
        <li class="terms-list__item">
          Phrase behält sich vor, Mitverschulden geltend zu machen (z.B. Verletzung seiner Pflichten gemäß Ziffer 6 dieser AGB durch den Kunden).
        </li>
        <li class="terms-list__item">
          Die Verjährungsfrist für Haftungsansprüche gegen Phrase verkürzt sich auf 12 Monate, es sei denn, es liegt ein Fall gemäß § 8 Nr. 2 Buchstabe a) vor.
        </li>
      </ol>

      <h3>Abschnitt 9: Annahme</h3>
      <p>
        Vertragliche Leistungen gelten bei Inanspruchnahme der Leistungen, spätestens jedoch zehn (10) Tage nach Bereitstellung der Leistungen als angenommen, es sei denn, der Kunde meldet einen Mangel, der die Abnahme innerhalb von zehn (10) Tagen verhindert.
      </p>

      <h3>Abschnitt 10: Nutzungsrechte</h3>
      <ol class="terms-list">
        <li class="terms-list__item">
          Das Urheberrecht an den Inhalten des Kunden wird durch die Nutzung der Dienste nicht berührt, jegliches Recht zur Nutzung dieser Inhalte wird nur dann auf Phrase übertragen, wenn dies erforderlich ist, damit Phrase seine im Rahmen des gebuchten Plans vereinbarten Leistungen für den Kunden erbringen kann.
        </li>
        <li class="terms-list__item">
          Die Urheberrechte an den Leistungen verbleiben allein bei Phrase; dem Kunden wird nur ein einfaches, nicht übertragbares Recht eingeräumt, die Leistungen im Rahmen des Vertragszwecks und gebuchten Plans zu nutzen.
        </li>
        <li class="terms-list__item">
          Phrase kann den Zugang des Kunden zu den Leistungen (insbesondere Benutzernamen und Passwörter) aus Gründen der IT-Sicherheit vorübergehend aussetzen, wenn hinreichend wahrscheinlich ist, dass die Leistungen durch den Kunden oder einen unbefugten Dritten über die Zugangsmittel des Kunden vertragswidrig genutzt werden und sich dies negativ auf die Leistungen oder die Nutzungsfähigkeit anderer Kunden auswirken könnte. Phrase setzt den Zugang nur vorübergehend aus, wenn es erforderlich ist, unverzüglich zu handeln, um Beeinträchtigungen zu vermeiden. Phrase wird den Kunden informieren, sobald der Zugang gesperrt wird. Phrase wird den Kunden vorab in Textform benachrichtigen, soweit die Umstände dies zulassen. Phrase schränkt die Aussetzung des Zugangs auf den erforderlichen Zeitraum und Umfang ein. Weitere Ansprüche und Befugnisse von Phrase aus dem Vertrag oder Gesetz bleiben unberührt.
        </li>
      </ol>

      <h3>Abschnitt 11: Kundenreferenzen, Rechteeinräumung</h3>
      <p>
        Der Kunde räumt Phrase das jederzeit für die Zukunft frei widerrufliche Recht ein, die Namen des Unternehmens, der Produkte und Dienstleistungen des Kunden sowie die Logos und sonstigen Unternehmenskennungen des Kunden im Rahmen der Dienstleistungen von Phrase sowie in anderen Marketingmaterialien, die die Dienstleistungen von Phrase betreffen, mit Bezug auf das Kundenverhältnis zu verwenden, ohne dass Phrase zu einem solchen Verweis verpflichtet ist.
      </p>

      <h3>Abschnitt 12: Zahlungen, Fälligkeiten, Verzug, SEPA-Präsentationsfrist</h3>
      <ol class="terms-list">
        <li class="terms-list__item">
          Rechnungen werden nach Vertragsschluss ausgestellt. Phrase ist auch berechtigt, Rechnungen rein elektronisch auszustellen. Zahlungen sind sofort nach Rechnungserhalt und ohne jeden Abzug im Voraus fällig. Gerät der Kunde mit Zahlungen in Verzug oder überschreitet er nach entsprechender Mahnung die Grenzen des von ihm gebuchten Plans für einen Zeitraum von vierzehn (14) Kalendertagen oder mehr, so kann Phrase nach seiner Wahl die Erbringung der Leistungen ganz oder teilweise einstellen sowie rechtliche Mahnverfahren oder Gerichtsverfahren bezüglich aller bestehenden Verpflichtungen einleiten. Die Zahlung gilt als geleistet, sobald Phrase tatsächlich über den geschuldeten Betrag verfügen kann (bei Schecks: Datum der Gutschrift des Betrags vorbehaltlos).
        </li>
        <li class="terms-list__item">
          Bei Verzug berechnet Phrase Verzugszinsen gemäß § 288 II BGB.
        </li>
        <li class="terms-list__item">
          Wird ein Scheck nicht eingehalten oder die Zahlung eingestellt, ist Phrase berechtigt, alle verbleibenden Forderungen sofort – auch per Scheck – fällig zu erklären. Rücklastschriften führen zur sofortigen Fälligkeit aller Forderungen gegen den Kunden; diese Rücklastschriften werden in Höhe der tatsächlich entstandenen Kosten, mindestens jedoch in Höhe von jeweils 10,00 €, berechnet. Eine Verkürzung der SEPA-Vorstellungsfrist (Vorinformationsfrist für SEPA-Lastschriften) auf einen (1) Tag wird vereinbart. Der Kunde kann nur mit seinen Gegenforderungen aufrechnen, die unbestritten oder rechtskräftig festgestellt sind.
        </li>
      </ol>

      <h3>§ 13: Anpassung der Preise</h3>
      <p>
        Um insbesondere bei langfristigen Verträgen ein ausgewogenes Verhältnis zwischen Leistung und Gegenleistung aufrechtzuerhalten, behält sich Phrase das Recht vor, die Preisgestaltung seiner Pläne oder etwaiger Zusatzleistungen einmalig pro Kalenderjahr, zu Beginn der Verlängerungsfrist, um bis zu 20 Prozent, alternativ entsprechend der Entwicklung des Verbraucherpreisindex des Fakturierungsmonats, an die eigenen höheren Kosten anzupassen.
      </p>
      <p>
        Phrase hat dem Kunden eine Änderung in Textform zwei Monate im Voraus mitzuteilen. Die Änderung gilt als vereinbart, wenn der Kunde nicht innerhalb von drei Wochen nach Erhalt der Änderung in Textform widerspricht. Widerspricht der Kunde der Änderung, so hat Phrase ein außerordentliches Kündigungsrecht, das mit dem Tag wirksam wird, ab dem die Änderung wirksam wird. Phrase weist in der Änderung gesondert auf die Frist und die Rechtsfolgen der Nichteinhaltung hin.
      </p>

      <h3>§ 14: Datenverarbeitung, Rechtsabtretung</h3>
      <ol class="terms-list">
        <li class="terms-list__item">
          Satz soll
          <ol-Typ="a">
            <li class="terms-list__item">
              die vom Kunden zur Verfügung gestellten personenbezogenen Daten nur nach schriftlicher Anweisung des Kunden zu verarbeiten, es sei denn, (i) die personenbezogenen Daten müssen zur Erfüllung des Vertrags oder zur Verwaltung von Zugriffsrechten auf die Dienstleistungen verarbeitet werden, (ii) die personenbezogenen Daten müssen verarbeitet werden, um die Nutzung der Dienstleistungen zu überwachen und zu skalieren, um dem Kunden eine effiziente Ressourcenallokation zu ermöglichen, (iii) Phrase ist verpflichtet, die vom Kunden in die Dienstleistungen eingegebenen personenbezogenen Daten zu verarbeiten, oder (iv) Phrase ist aus anderen Gründen gesetzlich berechtigt, personenbezogene Daten zu verarbeiten;
            </li>
            <li class="terms-list__item">
              sicherstellen, dass Phrase über geeignete technische und organisatorische Maßnahmen verfügt, um personenbezogene Daten vor unbefugter oder unrechtmäßiger Verarbeitung zu schützen.
            </li>
            <li class="terms-list__item">
              Abschluss einer Vereinbarung über die Auftragsdatenverarbeitung mit dem Kunden, wenn dies im Einzelfall aufgrund der gesetzlichen Bestimmungen oder des konkreten Gegenstands der vereinbarten Leistungen erforderlich ist.
            </li>
            </ol>
        </li>
        <li class="terms-list__item">
          Phrase ist es gestattet, Analysen unter Verwendung von Informationen zu erstellen, die Phrase durch die Nutzung der Dienste durch den Kunden erhält. Die Daten werden anonymisiert und für solche Analysen aggregiert. Die Daten in solchen Analysen können zur Verbesserung der Qualität von Produkten, zur Ressourcenoptimierung sowie zur Erforschung und Entwicklung neuer Produkte, zur Verbesserung der Leistung und zur Überprüfung der Datensicherheit und -integrität sowie für Datenprodukte wie Branchentrends und anonymes Benchmarking verwendet werden.
        </li>
      </ol>

      <h3>Abschnitt 15: Änderungen der AGB</h3>
      <p>
        Diese AGB können für bestehende Vertragsverhältnisse geändert werden. Änderungen werden dem Kunden spätestens zwei Monate vor dem Tag, an dem sie wirksam werden, in Textform vorgeschlagen. Die Zustimmung des Kunden zum Angebot gilt als erteilt, sie lehnen den Vorschlag nicht innerhalb von zwei Wochen nach Erhalt in Textform ab. Lehnt der Kunde den Vorschlag ab, hat Phrase ein außerordentliches Recht, den Vertrag zu kündigen. Diese Kündigung wird mit dem Tag wirksam, ab dem die Änderung wirksam wird. In dem Vorschlag weist Phrase den Kunden gesondert auf die Frist hin und darauf, dass die Nichteinhaltung des Vorschlags die Zustimmung zum Vorschlag bedeutet.
      </p>

      <h3>§ 16: Rechtswahl, Erfüllungsort, Gerichtsstand, Textformerfordernis</h3>
      <p>
        Es gilt das Recht der Bundesrepublik Deutschland. Erfüllungsort und Gerichtsstand ist der Sitz der Memsource GmbH. Phrase kann den Kunden auch an dem Ort verklagen, an dem sich sein Vermögen befindet. Alle Änderungen dieser AGB und das Schriftformerfordernis bedürfen der Textform. Die Unwirksamkeit einzelner Bestimmungen berührt nicht die Wirksamkeit der übrigen Bestimmungen dieser AGB.
      </p>
