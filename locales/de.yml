    tooltips:
      2fa: Erhöhe deine Sicherheitsstandards und nutze zwei-Faktor Authentifizierung,
        sei es über 2FA-Token oder OAuth-Zugangs-Token.
      activity_tracking: Bleibe stets auf dem Laufenden. Durch unsere filterbare Aktivitätsübersicht
        kannst du Projektänderungen transparent nachverfolgen und zuordnen.
      advanced_api: Passe Phrase an deine Prozesse an. Interagiere mit Keys, Jobs,
        Termbanken, Screenshots und mehr über unsere leistungsstarke API.
      advanced_review_workflow: Der Erweiterte Review Workflow gibt vor, dass jede
        Übersetzung standardmäßig von einer zweiten Person überprüft werden muss.
      advanced_search: Finde Übersetzungskeys schneller, indem du nach bestimmten
        Inhalten, Keynamen und/oder Tags suchst.
      advanced_textmaster_integration: Verknüpfe Phrase Strings mit deinem TextMaster-Konto,
        um Übersetzungen genau nach deinen Anforderungen zu bestellen. Erhalte Rabatte
        und greife auf erweiterte Einstellungen zu, um die Übersetzungsqualität zu
        steigern.
      autofill: Lassen Sie Phrase neue Inhalte automatisch mit Translation Memory
        und maschineller Übersetzung übersetzen.
      basic_api: Passe Phrase an deinen Workflow an, mit Hilfe unserer API. Sie ermöglicht
        es dir, Sprachdateien zu importieren, Sprachdateien herunterzuladen, Keys
        zu taggen oder auf andere Weise mit den in Phrase für dein Konto gespeicherten
        Lokalisierungsdaten zu interagieren.
      basic_review_workflow: Übersetzungen, bei denen sich der Ausgangstext geändert
        hat, werden automatisch als 'nicht verifiziert' markiert. Filtere nicht verifizierte
        Übersetzungen mit einem Klick und fordere eine Verifizierung an.
      basic_search: Finde den gewünschten Key über eine Stichwortsuche.
      batch_actions: Wähle mehrere Keys aus, um Batch Actions durchzuführen, z. B.
        mehrere Keys auf einmal taggen oder verifizieren.
      branching: Arbeiten Sie an mehreren Releases und Versionen gleichzeitig-genau
        wie in git.
      checks: Überprüfe deine Übersetzungen auf häufige Probleme wie übermäßig lange
        Formulierungen, fehlende Platzhalter oder falsch übersetzte Begriffe.
      command_line_tool: Navigiere schnell von der Kommandozeile aus durch deine Projekte
        und Übersetzungen.
      comments_and_mentionings: Gib Übersetzer*innen Feedback und beantworte ihre
        Fragen mit unserer Kommentarfunktion. Erwähne @teammitglieder in Kommentaren
        und erhalte Email-Benachrichtigungen.
      contentful_integration: Kombiniere die Stärken von Phrase und Contentful! Nutze
        Phrase Strings, um deinen Übersetzungsprozess zu organisieren und die Übersetzungsqualität
        zu steigern. Greife von Contentful aus auf deine Übersetzungen zu, um sie
        auf mehreren Kanälen zu veröffentlichen.
      custom_contracts: Wir erstellen dir einen maßgeschneiderten Vertrag, der auf
        deine Compliance-Anforderungen zugeschnitten ist.
      custom_integrations: Frage eine neue Integration, die auf deine Anforderungen
        zugeschnitten ist, bei unserem Entwicklungsteam an.
      custom_sla: Wir bieten Service-Level Agreements mit höchster Verfügbarkeit.
      custom_user_roles: 'Unser Customer Success Team kann eine individuelle User-Rolle
        für dein Team erstellen. Stelle die Zugriffsrechte frei zusammen, sodass die
        Rolle perfekt auf eure Bedürfnisse abgestimmt ist. '
      figma: User-Interfaces mühelos übersetzen. Synchronisiere Designtexte zwischen
        Figma und Phrase Strings.
      file_format_conversion_and_syntax_validation: Vermeide fehlerhafte Sprachdateien
        dank unserer Validierungsprüfung.
      file_formats: Phrase unterstützt eine Vielzahl verschiedener Formate für den
        Datei-Import, Datei-Export und API-Zugriff.
      glossary: 'Eine einheitliche Kommunikation in allen Sprachen. Erstelle eine
        Termbank mit Begriffen, die für dein Unternehmen wichtig sind und definiere,
        wie sie übersetzt werden sollen. '
      history: Im Translation Editor kannst du alle früheren Versionen einer Übersetzung
        im Tab „Änderungen“ sehen.
      hmi_formats: Die Lokalisierung von Human Machine Interfaces kann spezifische
        Formate erfordern. Frag die Entwicklung des von dir benötigten Formats durch
        unser Team an!
      in_context_editor: Übersetze mit maximalem Kontext und prüfe, wie die Übersetzungen
        auf deiner Website aussehen würden.
      iso_and_tisax: Garantiert auf die  höchsten internationalen Standards für Informationssicherheit
        geprüft.
      jira_integration: 'Verbinde Jira mit Phrase, um automatisch Jira-Issues zu erstellen,
        wenn Übersetzungs-Jobs in Phrase gestartet oder abgeschlossen wurden. '
      jobs: Organisieren Sie alle Ihre Übersetzungsaufgaben, indem Sie Teammitglieder
        zuweisen, Beschreibungen bereitstellen und Fälligkeitstermine für die Sprachen
        Ihrer Wahl festlegen.
      key_tagging: Markiere mehrere Übersetzungs-Keys mit Tags, um sie leichter identifizieren
        und tracken zu können.
      notifications: Bleiben Sie immer über alle neuesten Änderungen in Ihrem Projekt
        durch Benachrichtigungen direkt in Phrase und per E-Mail informiert.
      over_the_air: Veröffentlichen und Vorschau mobiler App-Übersetzungen in Echtzeit
        direkt aus Phrase.
      personal_account_manager: Deine Ansprechperson innerhalb von Phrase hilft dabei,
        deine Lokalisierungsprozesse kontinuierlich zu optimieren.
      personal_onboarding_support: Wir bieten ein persönliches Onboarding sowie Workshops
        zur Einführung von Phrase an.
      project_based_user_roles: 'Definiere Zugangsrechte noch granularer, indem du
        für unterschiedliche Projekte unterschiedliche Nutzerrollen vergibst. '
      reports: Eine detaillierte Übersicht pro Teammitglied über übersetzte Wörter,
        übersetzte Keys und vieles mehr.
      saml_single_sign_on: Verwalte den Zugang zu Phrase bequem über SAML, mit einem
        Identity Provider deiner Wahl.
      screenshots: Erhöhen Sie die Kontextinformationen, indem Sie Screenshots an
        Ihre Übersetzungsschlüssel anfügen.
      sketch: Synchronisiere deine Sketch-Designs mit Phrase und integriere Lokalisierung
        in deinen Designprozess.
      slack: Halte alle Beteiligten über Übersetzungsprojekte auf dem Laufenden, indem
        du Phrase mit Slack verknüpfst.
      smart_suggest: Echtzeit-Übersetzungsvorschläge im Phrase Strings Editor. SmartSuggest
        beschleunigt die Übersetzungsarbeit und hilft bei der Vereinheitlichung der
        verwendeten Terminologie.
      source_copy_editing: Bearbeiten Sie Ihre Quellsprachendateien direkt in Phrase.
      spaces: 'Lokalisierungsprojekte in Spaces zu kategorisieren spart viel Zeit. '
      teams: Weise ganzen Teams Zugriffsrechte zu, anstatt sie für jeden User einzeln
        zu definieren.
      translation_editor: Nutze unseren browserbasierten und benutzerfreundlichen
        Editor fürs Übersetzen.
      translation_memory: Beschleunigen Sie Ihren Lokalisierungsprozess mit unserem
        Translation Memory. Das Translation Memory merkt sich die in Ihren Projekten
        verwendeten Übersetzungen und schlägt passende Ergebnisse vor.
      translation_ordering: Arbeiten Sie mit Ihrem eigenen Übersetzerteam zusammen
        oder bestellen Sie einfach professionelle Übersetzungen über Phrase.
      user_roles_and_access_control: Organisieren Sie Ihr Lokalisierungsteam, indem
        Sie jedem Teammitglied entsprechend den Projekten und Sprachen dedizierte
        Rollen und Zugriffsrechte zuweisen.
      version_control_tools: Synchronisiere deine Phrase Projekte mit deinen GitHub,
        GitLab oder Bitbucket Projekten.
      webhook_integration: Erhalte Benachrichtigungen von Phrase Strings in deinem
        Chat-Tool (z. B. Slack), Projekt-Management-Tool oder über eine externe API.
      wordpress: Übersetze WordPress-Inhalte in Phrase Strings. Mit der WordPress
        Integration hast du Zugriff auf alle Features in Phrase Strings, um die höchste
        Übersetzungsqualität zu erzielen.
      zapier: 'Halte alle Beteiligten auf dem Laufenden über den Übersetzungsfortschritt.
        Gib in Zapier an, welche Ereignisse in Phrase Aktionen in anderen Tools auslösen
        sollen. '
