    dpa_content: "<p>\n  <b>Verarbeitung gemäß Art. 28 Datenschutz-Grundverordnung
      (DSGVO):</b>\n</p>\n<p>\n  Vertrag zwischen dem für die Verarbeitung Verantwortlichen
      – im Folgenden Auftraggeber genannt – und der Memsource GmbH (ehemals Dynport
      GmbH) für den Auftragsverarbeiter Phrase.com – im Folgenden Lieferant genannt.\n</p>\n\n<h3>1.
      Vertragsgegenstand und Vertragsdauer</h3>\n\n<h4>(1) Gegenstand</h4>\n<p>\n
      \ Der Vertragsgegenstand ergibt sich aus dem vom Verantwortlichen gebuchten
      Phrase-Plan (nachfolgend „Hauptvertrag“).\n</p>\n\n<h4>(2) Dauer</h4>\n<p>\n
      \ Die Laufzeit dieses Vertrages entspricht der Laufzeit des Hauptvertrages.\n</p>\n\n<h3>2.
      Spezifikation der Vertragsdetails</h3>\n<h4>(1) Art und Zweck der beabsichtigten
      Datenverarbeitung</h4>\n\n<p>Der Gegenstand der Verarbeitung personenbezogener
      Daten umfasst folgende Zwecke:</p>\n<ol class=\"terms-list\" type=\"a\">\n  <li
      class=\"terms-list__item\">\n    <u>Anlegen eines Unternehmensprofils in der
      Hauptdatenbank:</u> Nach Abschluss der Kontoregistrierung werden die beim Ausfüllen
      des Kontoregistrierungsformulars an den Lieferanten übermittelten Kontoinformationen
      des Kunden in der Hauptdatenbank von Phrase verarbeitet. Es wird ein Kontoprofil
      eingerichtet, das personenbezogene Stammdaten, optionale personenbezogene Daten,
      Kontaktdaten, Kontaktdaten für die Vertragsabrechnung, Zahlungsdaten, Verkehrsdaten
      im Zusammenhang mit dem Konto des Kunden enthält.\n  </li>\n  <li class=\"terms-list__item\">\n
      \   <u>Kommunikation mit dem Phrase-Kunden per E-Mail:</u> Der Lieferant stellt
      die E-Mail-Kommunikation mit dem Kunden als wesentlichen Bestandteil der Kundenbeziehung
      her. Die E-Mail-Kommunikation umfasst hauptsächlich das Senden von Updates über
      die Plattform und ihre Dienstleistungen, freigegebene Funktionen und wichtige
      Informationen über den Lieferanten. Dies erfordert die Verarbeitung der personenbezogenen
      Daten und Kontaktdaten des Kunden;\n  </li>\n  <li class=\"terms-list__item\">\n
      \   <u>Pflege und Bereitstellung von Kundensupport:</u> Der Lieferant stellt
      den Kundensupport für den Kunden als wesentlichen Bestandteil der Kundenbeziehung
      her. Kundensupportanfragen können entweder per E-Mail oder über ein Chat-Widget
      gesendet werden. Dies erfordert die Verarbeitung der personenbezogenen Daten
      des Kunden, Kontaktdaten, Vertragskenndaten und Systemdaten;\n  </li>\n  <li
      class=\"terms-list__item\">\n    <u>Hosting von Phrase-Plattform und Phrase-Diensten:</u>
      Die gehostete Phrase-Plattform und alle ihre Dienste zur Softwareübersetzung
      und -lokalisierung, für die der Kunde sich angemeldet hat, werden auf Webserver-Produkten
      eines Hosting-Anbieters gehostet. Diese Webserver befinden sich in Irland (einem
      Mitgliedstaat der Europäischen Union) und gelten für die technischen und organisatorischen
      Maßnahmen, die der Anbieter unternimmt, um die Sicherheit der gesamten Datenverarbeitung
      auf seinen Webserver-Produkten zu gewährleisten;\n  </li>\n  <li class=\"terms-list__item\">\n
      \   <u>Verarbeitung von Kundenbewertungen:</u> Der Lieferant fordert den Kunden
      regelmäßig auf, eine quantifizierte Bewertung für die Phrase-Plattform abzugeben
      (Bewertung zwischen 1-10). Die Abgabe einer Bewertung ist für den Kunden immer
      optional. Bei der Abgabe einer solchen Bewertung wird der Kunde dann aufgefordert,
      eine detailliertere Bewertung abzugeben, indem er die messbare Bewertung ausarbeitet.
      In diesem Fall verarbeitet der Lieferant die personenbezogenen Daten und Kontaktdaten
      des Kunden aus dem Bewertungsformular;\n  </li>\n  <li class=\"terms-list__item\">\n
      \   <u>Verarbeitung von Kundenfeedback:</u> Der Lieferant dokumentiert Kundenfeedback,
      das durch Kundensupport, Kundenbewertungen oder Kundenfeedbackkanäle eingeholt
      wird, falls das Feedback für die Weiterentwicklung der Phrase-Plattform und
      ihrer Dienstleistungen von besonderer Bedeutung ist.Die Feedbackdokumentation
      des Lieferanten erfordert die Verarbeitung der personenbezogenen Daten des Kunden
      und der Kontaktdaten von Benutzern, die aktiv Feedback an den Lieferanten übermitteln;\n
      \ </li>\n  <li class=\"terms-list__item\">\n    <u>Verwaltung technischer Produktprobleme:</u>
      Der Lieferant muss Berichte über technische Produktprobleme („Fehler“) verwalten,
      die vom Kunden eingereicht werden, um seine Plattformwartung zu organisieren
      und durchzuführen.\n  </li>\n  <li class=\"terms-list__item\">\n    <u>Analyse
      der Nutzerinteraktion von Phrase-Kunden:</u> Der Lieferant analysiert die Nutzerinteraktion
      von Phrase-Kunden und deren Verhalten auf Websites der Phrase-Domain.\n  </li>\n
      \ <li class=\"terms-list__item\">\n    <u>Analyse der Nutzerinteraktion von
      Phrase-Funktionen:</u> Der Lieferant analysiert die Nutzerinteraktion von Phrase-Kunden
      und deren Nutzung der von Phrase angebotenen Funktionen und Dienstleistungen.\n
      \ </li>\n  <li class=\"terms-list__item\">\n    <u>Verwaltung von Inbound-Marketing-Leads:</u>
      Der Lieferant verwaltet Inbound-Marketing-Leads, indem er einen potenziellen
      Kunden an drei Berührungspunkten in zeitlicher Reihenfolge wie folgt identifiziert:
      Beim ersten Besuch der Phrase-Website, beim Ausfüllen des Kontoanmeldeformulars
      und nach Abschluss der Kontoanmeldung.\n  </li>\n  <li class=\"terms-list__item\">\n
      \   <u>Integration von Workflows auf verschiedenen Plattformen:</u> Der Lieferant
      muss Technologien implementieren, die die Integration von Workflows auf verschiedenen
      Plattformen ermöglichen, um interne Prozesse zu verbessern.\n  </li>\n  <li
      class=\"terms-list__item\">\n    <u>Verarbeitung von Kreditkartenzahlungen:</u>
      Der Lieferant wird Technologie eines Zahlungsanbieters verwenden, um Zahlungen
      mit der Kreditkarte des Kunden abzuwickeln, was die Verarbeitung der Kontaktdaten
      des Kunden für die Vertragsabrechnung erfordert;\n  </li>\n  <li class=\"terms-list__item\">\n
      \   <u>Verarbeitung von Banküberweisungen:</u> Der Lieferant verarbeitet die
      Kontaktdaten des Kunden zur Vertragsabrechnung, um Rechnungen zu erstellen;\n
      \ </li>\n  <li class=\"terms-list__item\">\n    <u>Over the Air:</u> Für die
      Over-the-Air Mobile SDk verarbeitet der Lieferant die IP-Adressen der Nutzer
      der Produkte des Kunden per Hash-Pseudonymisierung zur Berechnung der Phrase-Nutzungsgebühr
      sowie technische Informationen wie das verwendete Betriebssystem, die Betriebssystemversion
      sowie die Gerätesprache.\n  </li>\n</ol>\n\n<p>\n  Die vertraglich vereinbarte
      Verarbeitung der Daten erfolgt ausschließlich innerhalb eines Mitgliedstaats
      der Europäischen Union (EU) oder innerhalb eines Mitgliedstaats des Europäischen
      Wirtschaftsraums (EWR). Jede Übermittlung der Daten in einen Staat, der weder
      ein Mitgliedstaat der EU noch des EWR ist, bedarf der vorherigen Zustimmung
      des Kunden und erfolgt nur, wenn die besonderen Voraussetzungen der Art. 44
      ff. DSGVO erfüllt sind.\n  </li>\n</ul>\n\n<h4>(2) Art der Daten</h4>\n<p>\n
      \ Gegenstand der Verarbeitung personenbezogener Daten sind folgende Datentypen
      und Kategorien:\n</p>\n<ol class=\"terms-list\" type=\"a\">\n  <li class=\"terms-list__item\">\n
      \   Personenbezogene Stammdaten (Vorname, Nachname, Benutzername, Spitzname);\n
      \ </li>\n  <li class=\"terms-list__item\">\n    Optionale personenbezogene Daten
      (Telefonnummer, Berufsbezeichnung);\n  </li>\n  <li class=\"terms-list__item\">\n
      \   Kontaktdaten (persönliche E-Mail-Adresse);\n  </li>\n  <li class=\"terms-list__item\">\n
      \   Kontaktdaten für die Vertragsabrechnung (Postanschrift für Rechnungsempfänger,
      persönliche Firmen-E-Mail-Adresse für Rechnungsempfänger);\n  </li>\n  <li class=\"terms-list__item\">\n
      \   Zahlungsdaten (Zahlungsbedingungen, Name des Karteninhabers, Mahnhistorie);\n
      \ </li>\n  <li class=\"terms-list__item\">\n    Eckdaten (Kontonummer, Vertragsnummer,
      Vertragsbeziehungen, abgerechnete Pakete);\n  </li>\n  <li class=\"terms-list__item\">\n
      \   Interaktionsdaten (Funktionsnutzung, Fehlerberichterstellung, Website-Interaktion,
      Anzahl Websitzungen);\n  </li>\n  <li class=\"terms-list__item\">\n    Verkehrsdaten
      (Logfiles, IP-Adresse, Passwörter);\n  </li>\n  <li class=\"terms-list__item\">\n
      \   Systemdaten (Browsertyp, Browsersprache, Browserversion, Betriebssystemtyp).\n
      \ </li>\n</ol>\n\n<h4>(3) Kategorien der betroffenen Personen</h4>\n<p>\n  Die
      Kategorien der betroffenen Personen umfassen:\n</p>\n<ul type=\"disc\">\n  <li>Mitarbeiter
      und Partner des Kunden, wenn sie Nutzer des Dienstes des Lieferanten sind</li>\n
      \ <li>Abonnenten</li>\n  <li>Ansprechpartner für Vertragsabrechnung</li>\n</ul>\n\n<h3>3.
      Technische und organisatorische Maßnahmen</h3>\n<p>\n  (1) Der Lieferant hat
      vor Beginn der Verarbeitung die Durchführung der erforderlichen technischen
      und organisatorischen Maßnahmen, die im Vorfeld der Auftragsvergabe festgelegt
      sind, insbesondere hinsichtlich der detaillierten Ausführung des Auftrags, zu
      dokumentieren und diese dokumentierten Maßnahmen dem Auftraggeber zur Einsichtnahme
      vorzulegen. Mit der Annahme durch den Auftraggeber werden die dokumentierten
      Maßnahmen zur Grundlage des Vertrages. Soweit die Einsichtnahme/Auditierung
      durch den Auftraggeber Änderungsbedarf ergibt, werden diese einvernehmlich durchgeführt.\n</p>\n<p>\n
      \ (2) Der Lieferant hat die Sicherheit nach Art. 28 Abs. 3 Buchst. c und Art.
      32 DSGVO insbesondere in Verbindung mit Art. 5 Abs. 1 und Abs. 2 DSGVO herzustellen.
      Bei den zu treffenden Maßnahmen handelt es sich um Maßnahmen der Datensicherheit
      und um Maßnahmen, die ein dem Risiko angemessenes Schutzniveau hinsichtlich
      Vertraulichkeit, Integrität, Verfügbarkeit und Belastbarkeit der Systeme gewährleisten.
      Dabei sind der Stand der Technik, Implementierungskosten, Art, Umfang und Zwecke
      der Verarbeitung sowie die Eintrittswahrscheinlichkeit und die Schwere der Gefährdung
      der Rechte und Freiheiten natürlicher Personen im Sinne von Art. 32 Abs. 1 DSGVO
      zu berücksichtigen. [Details in Anlage 1]\n</p>\n<p>\n  (3) Die technischen
      und organisatorischen Maßnahmen unterliegen dem technischen Fortschritt und
      der Weiterentwicklung. Insoweit ist es dem Lieferanten gestattet, alternative
      angemessene Maßnahmen durchzuführen. Dabei darf das Sicherheitsniveau der definierten
      Maßnahmen nicht herabgesetzt werden. Wesentliche Änderungen sind zu dokumentieren.\n</p>\n\n<h3>4.
      Berichtigung, Einschränkung und Löschung von Daten</h3>\n<p>\n  (1) Der Lieferant
      darf Daten, die im Auftrag des Auftraggebers verarbeitet werden, nicht eigenmächtig
      berichtigen, löschen oder einschränken, sondern nur auf schriftliche Weisung
      des Auftraggebers.\n  <br>Sofern sich eine betroffene Person bezüglich einer
      Berichtigung, Löschung oder Einschränkung der Verarbeitung direkt an den Anbieter
      wendet, wird der Anbieter das Anliegen der betroffenen Person unverzüglich an
      den Auftraggeber weiterleiten.\n</p>\n\n<p>\n  (2) Soweit sie in den Leistungsumfang
      einbezogen ist, wird die Löschpolitik, „Recht auf Vergessenwerden“, Berichtigung,
      Datenübertragbarkeit und Zugriff vom Lieferanten nach dokumentierten Anweisungen
      des Auftraggebers unverzüglich sichergestellt.\n</p>\n\n<h3>5. Qualitätssicherung
      und sonstige Pflichten des Lieferanten</h3>\n<p>\n  Neben der Einhaltung der
      in dieser Bestellung oder diesem Vertrag festgelegten Regeln hat der Lieferant
      die gesetzlichen Anforderungen nach den Artikeln 28 bis 33 DSGVO zu erfüllen;
      entsprechend stellt der Lieferant insbesondere die Einhaltung folgender Anforderungen
      sicher:\n</p>\n\n<ol class=\"terms-list\" type=\"a\">\n  <li class=\"terms-list__item\">\n
      \   Beauftragter für Datenschutz, der seine Aufgaben unter Beachtung der Artikel
      38 und 39 DSGVO wahrnimmt.\n    <ul type=\"disc\">\n      <li>\n        Zum
      Zwecke der unmittelbaren Kontaktaufnahme werden dem Kunden seine Kontaktdaten
      mitgeteilt und der Kunde wird unverzüglich über einen Wechsel des Datenschutzbeauftragten
      informiert.\n      </li>\n      <li>\n        Der Lieferant hat Herrn Tobias
      Mauß, Mauß Datenschutz GmbH, Telefon: +49 40 99999520, E-Mail: datenschutz@datenschutzbeauftrager-hamburg.de,
      zum Datenschutzbeauftragten bestellt und den Auftraggeber unverzüglich über
      Änderungen des Datenschutzbeauftragten zu unterrichten.\n      </li>\n      <li>\n
      \       Seine aktuellen Kontaktdaten sind auf der Website des Lieferanten jederzeit
      abrufbar und leicht zugänglich.\n      </li>\n    </ul>\n  </li>\n  <li class=\"terms-list__item\">\n
      \   Vertraulichkeit gem. Art. 28 Abs. 3 S. 2 lit. b, Art. 29 und 32 Abs. 4 DSGVO.
      Mit der in diesem Vertrag beschriebenen Datenverarbeitung betraut der Lieferant
      nur diejenigen Mitarbeiter, die zur Vertraulichkeit verpflichtet sind und zuvor
      mit den für ihre Arbeit relevanten Datenschutzbestimmungen vertraut waren. Der
      Lieferant und jede unter seiner Aufsicht handelnde Person, die Zugang zu personenbezogenen
      Daten hat, dürfen diese Daten nur auf Anweisung des Kunden verarbeiten, was
      die in diesem Vertrag erteilten Befugnisse einschließt, es sei denn, dies ist
      gesetzlich vorgeschrieben.\n  </li>\n  <li class=\"terms-list__item\">\n    Durchführung
      und Einhaltung aller für diesen Auftrag oder Vertrag erforderlichen technischen
      und organisatorischen Maßnahmen gemäß Art. 28 Abs. 3 Satz 2 Buchst. c, Art.
      32 DSGVO [Details in Anlage 1].\n  </li>\n  <li class=\"terms-list__item\">\n
      \   Der Auftraggeber und der Lieferant arbeiten auf Verlangen mit der Aufsichtsbehörde
      bei der Erfüllung ihrer Aufgaben zusammen.\n  </li>\n  <li class=\"terms-list__item\">\n
      \   Der Kunde wird unverzüglich über alle von der Aufsichtsbehörde durchgeführten
      Inspektionen und Maßnahmen informiert, soweit sie sich auf diesen Auftrag oder
      Vertrag beziehen, und zwar auch, soweit gegen den Lieferanten ermittelt wird
      oder er an einer Untersuchung einer zuständigen Behörde im Zusammenhang mit
      Verstößen gegen ein Zivil- oder Strafrecht oder Verwaltungsvorschriften oder
      -vorschriften über die Verarbeitung personenbezogener Daten im Zusammenhang
      mit der Abwicklung dieses Auftrags oder Vertrages beteiligt ist.\n  </li>\n
      \ <li class=\"terms-list__item\">\n    Soweit der Auftraggeber einer Überprüfung
      durch die Aufsichtsbehörde, einer Ordnungswidrigkeit oder einem summarischen
      Straftat- oder Strafverfahren, einem Haftungsanspruch einer betroffenen Person
      oder eines Dritten oder einem sonstigen Anspruch im Zusammenhang mit der Auftrags-
      oder Vertragsdatenverarbeitung durch den Auftragnehmer unterliegt, wird der
      Auftragnehmer sich bemühen, den Auftraggeber zu unterstützen.\n  </li>\n  <li
      class=\"terms-list__item\">\n    Der Lieferant überwacht regelmäßig die internen
      Prozesse und die technischen und organisatorischen Maßnahmen, um sicherzustellen,
      dass die Verarbeitung in seinem Verantwortungsbereich den Anforderungen des
      geltenden Datenschutzrechts und dem Schutz der Rechte der betroffenen Person
      entspricht.\n  </li>\n  <li class=\"terms-list__item\">\n    Überprüfbarkeit
      der technischen und organisatorischen Maßnahmen des Auftraggebers im Rahmen
      der in Ziffer 7 dieses Vertrages genannten Aufsichtsbefugnisse des Auftraggebers.\n
      \ </li>\n</ol>\n\n<h3>6. Unterauftragsvergabe</h3>\n<p>\n  (1) Unter Unter Unterauftragnahme
      im Sinne dieses Vertrages sind Leistungen zu verstehen, die unmittelbar mit
      der Erbringung der Hauptleistung zusammenhängen; hiervon ausgenommen sind Nebenleistungen,
      wie Telekommunikationsdienste, Post-/Transportdienste, Wartungs- und Nutzerbetreuungsleistungen
      oder die Entsorgung von Datenträgern, sowie sonstige Maßnahmen zur Gewährleistung
      der Vertraulichkeit, Verfügbarkeit, Integrität und Belastbarkeit der Hard- und
      Software von Datenverarbeitungsanlagen. Der Lieferant ist jedoch verpflichtet,
      angemessene und rechtsverbindliche vertragliche Vereinbarungen zu treffen und
      geeignete Kontrollmaßnahmen zu ergreifen, um den Datenschutz und die Datensicherheit
      der Daten des Auftraggebers auch bei ausgelagerten Nebenleistungen zu gewährleisten.\n</p>\n<p>\n
      \ (2) Der Lieferant darf nur (i) nach vorheriger ausdrücklicher schriftlicher
      Zustimmung oder (ii) dokumentierter allgemeiner Zustimmung des Auftraggebers
      gemäß diesem Absatz Subunternehmer (zusätzliche Datenverarbeiter) beauftragen.\n</p>\n\n<ol
      class=\"terms-list\" type=\"a\">\n  <li class=\"terms-list__item\">\n    Der
      Auftraggeber stimmt der Beauftragung folgender Subunternehmer unter der Voraussetzung
      einer vertraglichen Vereinbarung gemäß Artikel 28 Absätze 2-4 DSGVO zu.Informationen
      über Subverarbeiter, einschließlich ihrer Funktionen und Standorte, sind unter
      https://phrase.com/subprocessor-overview/ (wie von Memsource gemäß diesem Datenverarbeitungszusatz
      von Zeit zu Zeit aktualisiert) verfügbar. \n  </li>\n  <li class=\"terms-list__item\">\n
      \   Outsourcing an Subunternehmer oder Wechsel des bestehenden Subunternehmers
      sind zulässig, wenn:\n    <ul type=\"disc\">\n      <li>\n        Der Lieferant
      reicht eine solche Auslagerung an einen Subunternehmer schriftlich oder in Textform
      mit angemessener Vorankündigung an den Auftraggeber ein; und\n      </li>\n
      \     <li>\n        Der Auftraggeber hat der geplanten Auslagerung gemäß Ziff.
      6 Abs. 3 nicht widersprochen; und\n      </li>\n      <li>\n        Die Unterauftragsvergabe
      erfolgt auf Grundlage einer vertraglichen Vereinbarung gem. Art. 28 Abs. 2-4
      DSGVO.\n      </li>\n    </ul>\n  </li>\n</ol>\n\n<p>\n  (3) Wenn der Auftraggeber
      der geplanten Auslagerung widersprechen will, kann er den Hauptvertrag schriftlich
      oder in Textform kündigen. Die Kündigung wird entweder zu dem vom Auftraggeber
      bestimmten Zeitpunkt oder zu dem Zeitpunkt wirksam, zu dem die geplante Auslagerung
      wirksam wird; je nachdem, welches der frühere Zeitpunkt ist. Kündigt der Auftraggeber
      den Hauptvertrag nicht innerhalb einer Frist von zehn Tagen ab dem Datum der
      Mitteilung des Auftragnehmers, so gilt der Auftraggeber als mit der geplanten
      Auslagerung einverstanden. Jede Kündigung nach diesem Unterabschnitt gilt als
      von beiden Seiten unverschuldet. \n</p>\n<p>\n  (4) Die Übermittlung personenbezogener
      Daten vom Auftraggeber an den Subunternehmer und die Subunternehmer erfolgt
      erst nach Erfüllung aller Anforderungen.\n</p>\n<p>\n  (5) Erbringt der Subunternehmer
      die vereinbarte Leistung außerhalb der EU/des EWR, so hat der Lieferant durch
      geeignete Maßnahmen die Einhaltung der EU-Datenschutzvorschriften sicherzustellen;
      gleiches gilt, wenn Dienstleister im Sinne von Abs. 1 Satz 2 eingesetzt werden
      sollen. \n</p>\n<p>\n  (6) Eine weitere Auslagerung durch den Subunternehmer
      ist zulässig, wenn\n</p>\n<ul type=\"disc\">\n  <li>\n    entweder der Lieferant
      zuvor ausdrücklich zugestimmt hat oder\n  </li>\n  <li>\n    alternativ haben
      der Lieferant und der Unterauftragnehmer (i) ein Verfahren vereinbart, das dem
      in § 6 Absatz 2 Buchstabe b) genannten Verfahren entspricht und (ii) entsprechend
      vorgegangen sind. \n  </li>\n</ul>\n<p>\n  Alle vertraglichen Regelungen in
      der Vertragskette werden jedem weiteren Subunternehmer mitgeteilt und mit ihm
      vereinbart.\n</p>\n\n<h3>7. Aufsichtsbefugnisse des Auftraggebers</h3>\n<p>\n
      \ (1) Der Kunde ist berechtigt, nach Rücksprache mit dem Lieferanten Prüfungen
      vorzunehmen oder von einem im Einzelfall zu benennenden Wirtschaftsprüfer durchführen
      zu lassen und sich von der Einhaltung dieser Vereinbarung durch den Lieferanten
      in seinem Geschäftsbetrieb durch stichprobenartige Kontrollen, die in der Regel
      rechtzeitig bekannt zu geben sind, zu überzeugen.\n</p>\n<p>\n  (2) Der Lieferant
      hat sicherzustellen, dass der Kunde die Einhaltung der Verpflichtungen des Lieferanten
      nach Art. 28 DSGVO überprüfen kann und verpflichtet sich, dem Kunden auf Verlangen
      die erforderlichen Auskünfte zu erteilen und insbesondere die Durchführung der
      technischen und organisatorischen Maßnahmen nachzuweisen.\n</p>\n<p>\n  (3)
      Der Nachweis solcher Maßnahmen, die nicht nur den konkreten Auftrag oder Vertrag
      betreffen, kann erbracht werden durch\n</p>\n<ul type=\"disc\">\n  <li>\n    Einhaltung
      genehmigter Verhaltenskodizes gemäß Artikel 40 DSGVO;\n  </li>\n  <li>\n    Zertifizierung
      nach einem zugelassenen Zertifizierungsverfahren gemäß Art. 42 DSGVO;\n  </li>\n
      \ <li>\n    Aktuelle Prüferzertifikate, Berichte oder Auszüge aus Berichten
      unabhängiger Stellen (z.B. Prüfer, Datenschutzbeauftragter, IT-Sicherheitsabteilung,
      Datenschutzprüfer, Qualitätsprüfer)\n  </li>\n  <li>\n    Eine geeignete Zertifizierung
      durch IT-Sicherheits- oder Datenschutzaudits (z.B. nach BSI-Grundschutz (IT-Basisschutzzertifizierung
      entwickelt vom Bundesamt für Sicherheit in der Informationstechnik (BSI)) oder
      ISO/IEC 27001).\n  </li>\n</ul>\n<p>\n  (4) Der Lieferant kann für die Ermöglichung
      von Kundeninspektionen Vergütung verlangen. \n</p>\n\n<h3>8. Kommunikation bei
      Verstößen des Lieferanten</h3>\n<p>\n  (1) Der Lieferant unterstützt den Kunden
      bei der Einhaltung der in den Artikeln 32 bis 36 DSGVO genannten Pflichten zur
      Sicherheit personenbezogener Daten, Meldepflichten bei Datenschutzverletzungen,
      Datenschutzfolgenabschätzungen und vorherigen Konsultationen.\n</p>\n\n<ol class=\"terms-list\"
      type=\"a\">\n  <li class=\"terms-list__item\">\n    Gewährleistung eines angemessenen
      Schutzniveaus durch technische und organisatorische Maßnahmen, die den Umständen
      und Zwecken der Verarbeitung sowie der prognostizierten Wahrscheinlichkeit und
      Schwere eines möglichen Rechtsverstoßes infolge von Sicherheitslücken Rechnung
      tragen und eine sofortige Erkennung relevanter Rechtsverstoßereignisse ermöglichen.\n
      \ </li>\n  <li class=\"terms-list__item\">\n    Verpflichtung, eine Verletzung
      des Schutzes personenbezogener Daten unverzüglich dem Auftraggeber zu melden
      \n  </li>\n  <li class=\"terms-list__item\">\n    Die Pflicht, den Kunden bei
      der Informationspflicht des Kunden gegenüber der betroffenen Person zu unterstützen
      und dem Kunden unverzüglich alle diesbezüglich relevanten Informationen zur
      Verfügung zu stellen.\n  </li>\n  <li class=\"terms-list__item\">\n    Unterstützung
      des Kunden bei der Datenschutz-Folgenabschätzung\n  </li>\n  <li class=\"terms-list__item\">\n
      \   Unterstützung des Mandanten bei vorheriger Konsultation der Aufsichtsbehörde\n
      \ </li>\n</ol>\n<p>\n  (2) Der Lieferant kann Schadenersatz für Supportleistungen
      verlangen, die nicht in der Leistungsbeschreibung enthalten sind und die nicht
      auf Ausfälle des Lieferanten zurückzuführen sind.\n</p>\n\n<h3>9. Weisungsbefugnis
      des Auftraggebers</h3>\n<p>\n  (1) Der Auftraggeber hat mündliche Weisungen
      unverzüglich (mindestens in Textform) zu bestätigen.\n</p>\n<p>\n  (2) Der Lieferant
      hat den Auftraggeber unverzüglich zu informieren, wenn er der Auffassung ist,
      dass eine Weisung gegen die Datenschutzbestimmungen verstößt, und ist dann berechtigt,
      die Ausführung der entsprechenden Weisungen auszusetzen, bis der Auftraggeber
      diese bestätigt oder ändert.\n</p>\n\n<h3>10. Löschung und Rückgabe personenbezogener
      Daten</h3>\n<p>\n  (1) Kopien oder Duplikate der Daten dürfen niemals ohne Wissen
      des Auftraggebers erstellt werden, mit Ausnahme von Sicherungskopien, soweit
      sie für eine ordnungsgemäße Datenverarbeitung erforderlich sind, sowie Daten,
      die zur Erfüllung gesetzlicher Aufbewahrungspflichten erforderlich sind.\n</p>\n<p>\n
      \ (2) Nach Abschluss der vertraglichen Arbeiten, spätestens aber früher auf
      Verlangen des Auftraggebers, spätestens nach Beendigung des Leistungsvertrages,
      hat der Auftragnehmer alle in seinen Besitz gelangten Unterlagen, Verarbeitungs-
      und Verwertungsergebnisse sowie Datensätze im Zusammenhang mit dem Vertrag datenschutzkonform
      an den Auftraggeber zu übergeben oder – vorbehaltlich vorheriger Zustimmung
      – zu vernichten. Gleiches gilt für alle damit verbundenen Prüf-, Abfall-, Redundanz-
      und Wegwerfmaterialien. Das Protokoll der Vernichtung oder Löschung ist auf
      Verlangen zur Verfügung zu stellen.\n</p>\n<p>\n  (3) Unterlagen, die dem Nachweis
      einer ordnungsgemäßen Datenverarbeitung gemäß Auftrag oder Vertrag dienen, werden
      vom Lieferanten nach Maßgabe der jeweiligen Aufbewahrungsfristen über die Vertragsdauer
      hinaus gespeichert und können dem Kunden nach Ablauf der Vertragsdauer zur Befreiung
      vom Lieferanten von dieser vertraglichen Verpflichtung ausgehändigt werden.\n</p>\n\n<br>\n<br>\n<hr>\n<br>\n<br>\n\n<b>Anlage
      Technische und organisatorische Maßnahmen</b>\n\n<h3>1. Vertraulichkeit (Artikel
      32 Absatz 1 Buchstabe b DSGVO)</h3>\n<p>\n  <b>Kontrollierte Gegenstände:</b>
      Das Risiko physischer, materieller oder immaterieller Schäden bzw. die Gefahr
      der Beeinträchtigung von Rechten und Pflichten der Betroffenen durch unbefugte
      Offenlegung oder unbefugten Zugriff auf Daten, die gemäß dem Hauptvertrag verarbeitet
      werden, wird verringert.\n</p>\n\n<p>\n  <u>Technische und organisatorische
      Maßnahmen:</u>\n</p>\n<ul type=\"disc\">\n  <li>\n    <b>Sicherheitsschlösser:</b>
      Die Eingangstüren zum Arbeitsplatz des Lieferanten sind vollständig durch Sicherheitsschlösser
      gesichert.\n  </li>\n  <li>\n    <b>Büroschlüssel-Regelung:</b> Ein Büroschlüssel-Regelungssystem
      ist aktiv, um die Verteilung der Büroschlüssel, die Zugang zum Arbeitsbereich
      des Lieferanten gewähren, streng zu verwalten. Büroschlüssel können nur nach
      persönlicher Unterzeichnung des Empfangs der effektiven Übergabe entgegengenommen
      werden.\n  </li>\n  <li>\n    <b>Verwaltung von Benutzerberechtigungen:</b>
      Ein Benutzerberechtigungsverwaltungssystem ist aktiv, um die Verwaltung der
      individuellen Benutzerberechtigungen zu regeln und so den individuellen Zugriff
      des Benutzers auf Daten zu regeln. Die Anzahl der Administratoren, die die Benutzerberechtigung
      verwalten dürfen, wird auf ein Minimum beschränkt. Das Benutzerberechtigungsverwaltungssystem
      legt ausdrücklich fest, wie die Berechtigung auf der Grundlage der besetzten
      Rolle des einzelnen Benutzers innerhalb des Arbeitsbereichs des Lieferanten
      verteilt werden soll, insbesondere im Hinblick auf die Datenverarbeitung.\n
      \ </li>\n  <li>\n    <b>Authentifizierung mit Benutzername und Passwort:</b>
      Alle vom Lieferanten verarbeiteten Daten und alle von Subunternehmern des Lieferanten
      erbrachten Datenverarbeitungsleistungen bedürfen der Benutzerauthentifizierung
      mit Benutzername und Passwort.\n  </li>\n  <li>\n    <b>Kennwortrichtlinie,
      einschließlich Kennwortlänge und Kennwortänderungen:</b> Am Arbeitsplatz des
      Lieferanten ist eine Kennwortrichtlinie aktiv, um die Kennwortsicherheit zu
      erzwingen. Die Kennwortrichtlinie wird im gesamten Arbeitsplatz des Lieferanten
      kommuniziert. Die Einführung und Durchsetzung der Kennwortrichtlinie für neue
      Mitarbeiter am Arbeitsplatz des Lieferanten ist inkrementell zu Standard-Onboarding-Prozessen.
      \n  </li>\n  <li>\n    <b>2-Faktor-Authentifizierung:</b> Die 2-Faktor-Authentifizierung
      wird am Arbeitsplatz des Lieferanten streng erzwungen, um die Benutzeridentifizierung
      bei jedem Zugriff auf Daten oder Datenverarbeitungsdienste zu gewährleisten.
      Die Einführung und Durchsetzung der 2-Faktor-Authentifizierung für neue Mitarbeiter
      am Arbeitsplatz des Lieferanten ist inkrementell zu den Standard-Onboarding-Prozessen.
      Interne Audits erzwingen eine regelmäßige Bewertung der effektiven Implementierung
      der 2-Faktor-Authentifizierung im gesamten Arbeitsplatz des Lieferanten.\n  </li>\n
      \ <li>\n    <b>Die Zuweisung von Berechtigungen zum Einfügen, Aktualisieren
      oder Löschen von Daten erfolgt auf der Grundlage eines Zuweisungskonzepts:</b>
      Die Zuweisung von Benutzerberechtigungen erfolgt gemäß dem Benutzerberechtigungsverwaltungssystem.
      Nur Administratoren können die Berechtigung zum Einfügen, Aktualisieren oder
      Löschen von Daten zuweisen.\n  </li>\n  <li>\n    <b>Nutzung der Software-Firewall:</b>
      Alle Elemente der IT-Infrastruktur des Lieferanten werden in einem sicheren
      VPC bereitgestellt.Firewall-Setup der IT-Infrastruktur und Zugriff ist im Software-Firewall-Konzept
      streng geregelt.\n  </li>\n  <li>\n    <b>Die Auswahl der Büroreinigungsdienste
      erfolgt aufgrund einer sorgfältigen Sorgfaltspflicht im Hinblick auf den Datenschutz:</b>
      Datenschutz und Vertraulichkeit der Daten innerhalb des Arbeitsbereichs des
      Lieferanten sind bei der Auswahl der Büroreinigungsdienstleister von entscheidender
      Bedeutung.\n  </li>\n</ul>\n\n<h3>2. Integrität (Artikel 32 Absatz 1 Buchstabe
      b DSGVO)</h3>\n\n<p>\n  <b>Kontrollierte Gegenstände:</b> Das Risiko physischer,
      materieller oder immaterieller Schäden bzw. die Gefahr der Beeinträchtigung
      von Rechten und Pflichten der Betroffenen, die durch unbeabsichtigte oder unbefugte
      Änderungen der gemäß dem Hauptvertrag verarbeiteten Daten oder durch unrechtmäßiges
      oder fahrlässiges Handeln verursacht werden, ist zu verringern.\n</p>\n<p>\n
      \ <u>Technische und organisatorische Maßnahmen:</u>\n</p>\n<ul type=\"disc\">\n
      \ <li>\n    <b>Nutzung der VPN-Technologie:</b> Die Produktionsumgebung des
      Lieferanten ist nur mit VPN-Technologie zugänglich. \n  </li>\n  <li>\n    <b>Die
      Anzahl der Administratoren ist auf ein Minimum reduziert:</b> Der Zugriff auf
      das Benutzerberechtigungsmanagementsystem ist streng auf eine Mindestanzahl
      von Administratoren beschränkt. \n  </li>\n  <li>\n    <b>Einsatz von Aktenvernichtern:</b>
      Die physische Löschung von Daten durch den Einsatz von Aktenvernichtern erfolgt.Mitarbeiter
      am Arbeitsplatz des Lieferanten werden angewiesen, Aktenvernichter zum Löschen
      von Papierkram mit personenbezogenen Daten einzusetzen.\n  </li>\n  <li>\n    <b>Aufzeichnungen
      zum Einfügen, Aktualisieren und Löschen von Daten:</b> Zur Aufzeichnung des
      Einfügens, Aktualisierens und Löschens von Daten wird ein Protokollierungssystem
      installiert.\n  </li>\n  <li>\n    <b>Übersicht über Berechtigungen und Funktionen:
      Welche Anwendungen welche Daten einfügen, aktualisieren und löschen können:</b>
      Der Schreibzugriff auf die Datenbank ist auf die Anwendung beschränkt, die dem
      Hauptvertrag zwischen Client und Lieferant unterliegt. Die Anwendung ermöglicht
      das Einfügen, Aktualisieren und Löschen von Daten sowohl im Anwendungs-Frontend
      als auch im Backend. Berechtigungen zum Einfügen, Aktualisieren und Löschen
      von Daten werden entsprechend dem Benutzerberechtigungsmanagementsystem verteilt.\n
      \   System.\n  </li>\n  <li>\n    <b>Vor der Auswahl des Datenunterauftragsverarbeiters
      erfolgt eine Prüfung unter besonderer Berücksichtigung des Datenschutzes:</b>
      Die Bewertung des Lieferanten bei der Auswahl der Datenunterauftragsverarbeiter
      als Unterauftragnehmer erfolgt nach Standardprüfungsverfahren im Sinne des Datenschutzkonzeptes.\n
      \ </li>\n  <li>\n    <b>Die Überprüfung und Dokumentation der technischen und
      organisatorischen Maßnahmen des Subunternehmers erfolgt vor der Auswahl des
      Subunternehmers:</b> Standarddiligence-Prozesse für die Auswahl der Daten Der
      im Datenschutzkonzept definierte Lieferant umfasst die Überprüfung der technischen
      und organisatorischen Maßnahmen vor der Auswahl des Subunternehmers.\n  </li>\n
      \ <li>\n    <b>Unterauftragnehmer erhalten verbindliche Anweisungen aus unterzeichneten
      Datenverarbeitungsverträgen:</b> Der Lieferant hat mit allen Unterauftragnehmern
      gemäß Ziffer 6 Datenverarbeitungsverträge zu unterzeichnen, um dem Unterauftragnehmer
      verbindliche Anweisungen in Bezug auf Pflichten, Pflichten und technische und
      organisatorische Maßnahmen zur konformen Datenverarbeitung zu erteilen.\n  </li>\n
      \ <li>\n    <b>Unterauftragnehmer und ihre Tätigkeiten werden regelmäßig auditiert:</b>
      Standardprozesse einschließlich regelmäßiger Audits der Unterauftragnehmer und
      ihrer Tätigkeiten werden am Arbeitsplatz des Lieferanten festgelegt.\n  </li>\n
      \ <li>\n    <b>Auftragnehmermanagementsystem:</b> Am Arbeitsplatz des Lieferanten
      wird ein Auftragnehmermanagementsystem installiert, um alle beauftragten Dienstleister
      hinsichtlich ihrer Datenschutzpflichten und -pflichten wie Herkunftsland, Postanschrift,
      technische und organisatorische Maßnahmen und unterzeichnete Datenverarbeitungsverträge
      zu verwalten.\n  </li>\n</ul>\n\n<h3>3. Verfügbarkeit (Artikel 32 Absatz 1 Buchstabe
      b DSGVO)</h3>\n\n<p>\n  <b>Kontrollierte Gegenstände:</b> Das Risiko physischer,
      materieller oder immaterieller Schäden bzw. die Gefahr der Beeinträchtigung
      von Rechten und Pflichten der Betroffenen, die durch rechtswidriges oder fahrlässiges
      Handeln oder durch Nichtverfügbarkeit von Daten verursacht werden, die gemäß
      dem Hauptabkommen verarbeitet werden, ist zu verringern.\n</p>\n\n<p>\n  <u>Technische
      und organisatorische Maßnahmen:</u>\n</p>\n\n<ul type=\"disc\">\n  <li>\n    <b>Datenspeicherort
      ist sicher getrennt:</b> Der Datenspeicher befindet sich in Irland.Datenspeicher
      ist sicher getrennt vom Datensicherungsspeicherort und vom Arbeitsplatz des
      Lieferanten.\n  </li>\n  <li>\n    <b>Konzept zur Datensicherung und Datenwiederherstellung:</b>
      Um Datensicherungen und umfassende Möglichkeiten zur Datenwiederherstellung
      bereitzustellen, wurden automatisierte Standardprozesse installiert, die im
      Datensicherungskonzept definiert sind.\n  </li>\n  <li>\n    <b>Test der Datenwiederherstellung:</b>
      Das Datensicherungskonzept wird regelmäßig internen Audits unterzogen.\n  </li>\n</ul>\n\n<h3>4.
      Belastbarkeit (Art. 32 Abs. 1 lit. b DSGVO)</h3>\n\n<p>\n  <b>Kontrollierte
      Gegenstände:</b> Das Risiko physischer, materieller oder immaterieller Schäden
      bzw. die Gefahr der Beeinträchtigung von Rechten und Pflichten der Betroffenen
      durch Vernichtung, Verlust, Veränderung oder unbefugte Offenlegung infolge von
      Systemüberlastung oder Systemabsturz ist zu verringern.\n</p>\n<p>\n  <u>Technische
      und organisatorische Maßnahmen:</u>\n</p>\n<ul type=\"disc\">\n  <li>\n    <b>Technische
      und organisatorische Maßnahmen des Hosting-Anbieters:</b> Technische und organisatorische
      Maßnahmen von Amazon WebServices Inc. gelten, da die gemäß der Hauptvereinbarung
      erbrachten Dienste auf Webserver-Produkten von Amazon WebServices Inc. gehostet
      werden. Die technischen und organisatorischen Maßnahmen entsprechen der ISO27001-Zertifizierung.\n
      \ </li>\n  <li>\n    <b>Trennung von Produktionssystemen und Testsystemen:</b>
      Produktionssystem und Testsystem sind strikt getrennt. Die Tests werden immer
      nur auf lokalen Servern durchgeführt. Die Tests verarbeiten niemals die personenbezogenen
      Daten eines Kunden.\n  </li>\n  <li>\n    <b>Nutzungsrechteverwaltungskonzept:</b>
      Die Verwaltung der Zugriffsrechte durch den Lieferanten ist formal im Benutzerberechtigungsverwaltungskonzept
      festgelegt.\n  </li>\n  <li>\n    <b>Zuweisung von Benutzerrechten für den Datenbankzugriff:</b>
      Die Zulassung von Benutzerrechten für den Zugriff auf die Hauptdatenbank wird
      streng durch die Verwaltung der Benutzerrechte geregelt. Nur Administratoren
      können Zugriffsrechte für Benutzer einzeln freigeben. Administratoren müssen
      Zugriffsrechte gemäß den Regeln für die Verwaltung der Benutzerrechte freigeben.
      Darüber hinaus ermöglicht die verwendete VPN-Technologie eine Unterscheidung
      bei der Freigabe von Lesezugriffsrechten oder Schreib- und Lesezugriffsrechten.\n
      \ </li>\n  <li>\n    <b>Virtualisierung:</b> Virtualisierung ist sowohl für
      Testsysteme als auch für Funktionsbereitstellungen effektiv.\n  </li>\n  <li>\n
      \   <b>Rechenlastenausgleich:</b> Der Lastenausgleich für Rechenaufgaben wird
      vom Hosting-Anbieter Amazon WebServices Inc.\n  </li>\n</ul>\n\n<h3>5. Pseudonymisierung</h3>\n\n<p>\n
      \ <b>Kontrollierte Gegenstände:</b> Das Risiko physischer, materieller oder
      immaterieller Schäden bzw. die Gefahr der Beeinträchtigung von Rechten und Pflichten
      der Betroffenen durch unbefugte Offenlegung oder unbefugten Zugriff auf Daten,
      die gemäß dem Hauptvertrag verarbeitet werden, wird verringert.\n</p>\n\n<p>\n
      \ <u>Technische und organisatorische Maßnahmen:</u>\n</p>\n<ul type=\"disc\">\n
      \ <li>\n    <b>Datenverarbeitung pseudonymisierter Daten:</b> Um sichere Kreditkartenzahlungen
      zu ermöglichen, verarbeitet der Lieferant pseudonymisierte Abrechnungsdaten,
      die vom Kunden bei der Wahl von Kreditkartenzahlungen als bevorzugte Zahlungsmethode
      übermittelt werden. Die Pseudonymisierung der Abrechnungsdaten wird durch die
      Implementierung von Checkout gewährt, einer Funktion, die vom beauftragten Zahlungsdienstleister
      bereitgestellt wird.\n  </li>\n</ul>\n\n<h3>6. Verschlüsselung</h3>\n\n<p>\n
      \ <b>Kontrollierte Gegenstände:</b> Das Risiko physischer, materieller oder
      immaterieller Schäden bzw. die Gefahr der Beeinträchtigung von Rechten und Pflichten
      der Betroffenen durch unbefugte Offenlegung oder unbefugten Zugriff auf Daten,
      die gemäß dem Hauptvertrag verarbeitet werden, wird verringert.\n</p>\n\n<p>\n
      \ <b>Technische und organisatorische Maßnahmen:</b>\n</p>\n\n<ul type=\"disc\">\n
      \ <li>\n    <b>Verschlüsselung der Datenspeicherung:</b> Verarbeitete Daten
      werden vollständig durch technische und organisatorische Maßnahmen verschlüsselt,
      die beim Hosting-Anbieter in Kraft sind. Darüber hinaus führt der Anbieter SSL-Verschlüsselung
      auf allen seinen eigenen Domains und Subdomains durch. Die Verschlüsselung der
      im Rahmen der E-Mail-Konversation verarbeiteten Daten wird von GPG gewährt,
      die verwendet wird, wenn hochsensible Daten durch den Versand von E-Mails verarbeitet
      werden.\n  </li>\n  <li>\n    <b>Mobile Datenspeicherverschlüsselung:</b> Mobile
      Datenspeicherträger, die im Arbeitsbereich des Lieferanten oder in entfernten
      Arbeitsbereichen einsatzbereit sind, sind immer verschlüsselt. Die mobile Datenspeicherverschlüsselung
      ist Teil des Mitarbeiter-Onboardings des Lieferanten. Die mobile Datenspeicherung
      unterliegt einer Unternehmensrichtlinie des Lieferanten, in der die Anforderungen
      und technischen Anforderungen an die Verschlüsselung festgelegt sind.\n  </li>\n</ul>\n\n<h3>7.
      Wiederherstellungspraktiken des Zugriffs auf personenbezogene Daten bei physischen
      oder technischen Ereignissen</h3>\n\n<p>\n  <b>Kontrollierte Gegenstände:</b>
      Das Risiko physischer, materieller oder immaterieller Schäden bzw. die Gefahr
      der Beeinträchtigung von Rechten und Pflichten der Betroffenen, die durch unrechtmäßiges
      oder fahrlässiges Handeln, durch unbefugten Zugriff auf Daten oder durch Vernichtung,
      Verlust, Veränderung von Daten verursacht werden, die gemäß dem Hauptvertrag
      verarbeitet werden, ist zu verringern.\n</p>\n<p>\n  <u>Technische und organisatorische
      Maßnahmen:</u>\n</p>\n<ul type=\"disc\">\n  <li>\n    <b>Wiederherstellungskonzept
      mit detaillierten Anweisungen zur Systemwiederherstellung:</b> Das Wiederherstellungskonzept
      stellt sicher, dass alle für die IT-Infrastruktur des Lieferanten entscheidenden
      Stellen in den umfassenden Wiederherstellungsansatz einbezogen werden. Das Wiederherstellungskonzept
      folgt einer chronologischen Reihenfolge, kann also durch Befolgen genauer und
      präziser Checklistenpositionen ausgeführt werden. Es liegt in der Entscheidung
      der obersten Führungsebene, ob sie das Wiederherstellungskonzept selbst ausführt
      oder ob die Aufgabe Teammitgliedern zugewiesen wird, falls die unmittelbare
      Handlungsfähigkeit unsicher ist.\n  </li>\n</ul>\n\n<h3>Prüfverfahren zur Bewertung
      und Bewertung der Wirksamkeit technischer und organisatorischer Maßnahmen</h3>\n\n<p>\n
      \ <b>Kontrollierte Posten:</b> Um eine sichere Datenverarbeitung zu gewährleisten,
      müssen regelmäßige Audits, Bewertungen und Bewertungen der Wirksamkeit technischer
      und organisatorischer Maßnahmen durchgeführt werden.\n</p>\n<p>\n  <u>Technische
      und organisatorische Maßnahmen:</u>\n</p>\n<ul type=\"disc\">\n  <li>\n    <b>Interne
      Audits:</b> Die technischen und organisatorischen Maßnahmen des Lieferanten
      werden regelmäßig intern auditiert, um die Wirksamkeit technischer und organisatorischer
      Maßnahmen zu überprüfen. \n  </li>\n  <li>\n    <b>Externe Audits:</b> Das ISMS
      der Organisation unterhält eine ISO/IEC 27001:2013-Zertifizierung und sein ISMS
      wird von einem zertifizierten ISO27001-Auditor auditiert. Die technischen und
      organisatorischen Maßnahmen der externen Subunternehmer werden regelmäßig auditiert.
      Es wurde ein Standardprozess implementiert, um die Wirksamkeit technischer Maßnahmen
      und organisatorischer Maßnahmen zu überprüfen.\n  </li>\n  <li>\n    <b>Regelmäßige
      Sicherheitsüberprüfungen:</b>Security Review Meetings mit hochrangigen Führungskräften
      finden regelmäßig statt.\n  </li>\n</ul>\n\n<h3>9. Dokumentation</h3>\n\n<p>\n
      \ <b>Kontrollierte Punkte:</b>Die Dokumentation von Datenschutzrichtlinien,
      Standardprozessen und expliziten Aufträgen umfasst die spezifischen technischen
      und organisatorischen Maßnahmen, die Phrase unternimmt, um eine sichere Datenverarbeitung
      zu gewährleisten.\n</p>\n<p>\n  <u>Technische und organisatorische Maßnahmen:</u>\n</p>\n\n<ul
      type=\"disc\">\n  <li>\n    <b>Umfassendes Datenschutzkonzept:</b> Ein umfassendes
      Datenschutzkonzept steht im Mittelpunkt der Dokumentation der technischen und
      organisatorischen Maßnahmen des Lieferanten für eine sichere Datenverarbeitung.
      Das Konzept umfasst die Strategie des Vorstands für Datenschutz und Datenverarbeitung
      beim Lieferanten. Es bietet detaillierte IT-Spezifikationen zu den beim Lieferanten
      eingesetzten Systemen und Tools, um volle Transparenz und Fachwissen für die
      Mitarbeiter zu schaffen. Unternehmensrichtlinien zum Datenschutz sowie explizite
      Aufträge und regelmäßige Veranstaltungen zur Unternehmensschulung zum Datenschutz
      gewährleisten einen hohen Qualifikationsstandard für alle mit der Datenverarbeitung
      beauftragten Mitarbeiter.\n  </li>\n  <li>\n    <b>Datenschutzerklärungen:</b>
      Die Datenschutzrichtlinien sind formell im Datenschutzkonzept festgelegt und
      ergeben sich direkt aus der Datenschutzkonformität des Lieferanten, wodurch
      eine Top-down-Kommunikation über die Datenverarbeitung erzwungen wird.\n  </li>\n
      \ <li>\n    <b>Datenschutz-Standardprozesse:</b> Die Top-Down-Kommunikation
      über die Datenverarbeitung ist in Standardprozessen, einschließlich wiederkehrender
      Aufgaben der internen und externen Revision, präzise festgelegt und wird von
      geschulten Mitarbeitern mit entsprechend zugewiesenen Managementrechten zur
      Überwachung und Ausführung von Prozessen ausgeführt, um die Einhaltung der Datenschutzvorschriften
      des Lieferanten sicherzustellen. \n  </li>\n  <li>\n    <b>Aufgaben:</b>Explizite
      Arbeitsanweisungen zur Datenverarbeitung sind im Abschnitt „Aufgaben“ der Datenschutzdokumentation
      des Lieferanten formell angegeben und für alle Mitarbeiter verbindlich.\n  </li>\n</ul>"
